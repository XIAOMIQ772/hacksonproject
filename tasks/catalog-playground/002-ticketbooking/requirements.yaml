id: ROOT
name: Railway Ticket Booking Demo
type: FOLDER
dependencies: []
description: >-
  A small website where visitors can register or sign in, search published trains, select a journey, and create a booking. Accounts, sessions, and confirmed bookings persist. Payment, cancellation, refunds, seat inventory, order history, and timetable administration are outside scope.
children:
  - id: REQ-1
    name: Public home page and account access
    type: FOLDER
    dependencies: []
    description: >-
      The public header provides Register and Login when signed out, and the username and Sign out when signed in. Registration creates an account and session; login restores a session for an existing account.
    children:
      - id: REQ-1.1
        name: Register a traveler account
        type: ATOMIC
        dependencies: []
        description: |-
          Function: Register displays Nationality, Name, Passport number, Passport expiration date, Date of birth, Gender, Username, Email address, Password, Confirm password, a Terms of service/Privacy policy checkbox, and Next step. All fields are required. Name must contain 2–100 non-whitespace characters; passport number must contain 6–30 ASCII letters, digits, or hyphens; birth date must be in the past and passport expiration in the future. Username must be 3–32 ASCII letters, digits, hyphens, or underscores. Email must be valid and at most 254 characters. Password must be 12–128 characters and include uppercase, lowercase, digit, and special characters; confirmation must match. Username and email are unique, with email compared case-insensitively. A valid submission saves the account, signs the user in, and returns home. Invalid or duplicate input shows an error and creates no account or session.

          Required system data: The system must allow creation of independent accounts with username `tb-user-<timestamp>-<random>`, an email generated from that username using a valid domain, password `Valid-password-123!`, name `Ticket User <timestamp>-<random>`, nationality `Vietnam`, passport number `P<timestamp-digits>`, passport expiration date `2035-12-31`, date of birth `1995-06-15`, and gender `Male`. Duplicate-account examples reuse the same username or email. Invalid examples include username `bad username!`, email `not-an-email`, password `short`, a mismatched confirmation, a missing passport number, and unchecked terms.

          Optional visual reference: ![image](./reference/register.png)
        scenarios:
          - name: Register a valid traveler
            steps:
              - keyword: GIVEN
                content: A signed-out visitor has unique valid account and traveler details.
              - keyword: WHEN
                content: The visitor completes Register, accepts the terms, and clicks Next step.
              - keyword: THEN
                content: The home page shows the username and Sign out, including after reload.
          - name: Reject duplicate username
            steps:
              - keyword: GIVEN
                content: The username is already registered.
              - keyword: WHEN
                content: The visitor submits registration.
              - keyword: THEN
                content: Registration is rejected without a session.
          - name: Reject duplicate email
            steps:
              - keyword: GIVEN
                content: The email belongs to another account.
              - keyword: WHEN
                content: The visitor submits registration.
              - keyword: THEN
                content: Registration is rejected without a session.
          - name: Reject mismatched passwords
            steps:
              - keyword: GIVEN
                content: Password and confirmation differ.
              - keyword: WHEN
                content: The visitor submits registration.
              - keyword: THEN
                content: A validation error is shown.
          - name: Reject additional invalid registration combinations
            steps:
              - keyword: GIVEN
                content: Required traveler details are missing or the terms are not accepted.
              - keyword: WHEN
                content: The visitor submits registration.
              - keyword: THEN
                content: The relevant error is shown and no session is created.
          - name: Reject malformed credentials
            steps:
              - keyword: GIVEN
                content: Username, email, or password is malformed.
              - keyword: WHEN
                content: The visitor submits registration.
              - keyword: THEN
                content: No account or session is created.

      - id: REQ-1.2
        name: Sign in with an existing account
        type: ATOMIC
        dependencies:
          - REQ-1.1
        description: |-
          Function: Login provides Username or email, Password, and Login controls. The identifier is trimmed; email matching is case-insensitive and the password must match exactly. Valid credentials create a reload-persistent session and return home. Empty, unknown, or incorrect credentials show one generic error and leave the visitor signed out.

          Required system data: The system must contain an account created through REQ-1.1 with username `tb-user-<timestamp>-<random>`, an email generated from that username using a valid domain, and password `Valid-password-123!`. Valid login examples use that username or email, including values with leading and trailing spaces. Invalid examples use password `incorrect-password` or an email that does not belong to any account.

          Optional visual reference: ![image](./reference/login.png)
        scenarios:
          - name: Sign in with username
            steps:
              - keyword: GIVEN
                content: A saved account exists and the visitor is signed out.
              - keyword: WHEN
                content: The visitor submits its username and the correct password.
              - keyword: THEN
                content: The home page shows the saved username and Sign out, including after reload.
          - name: Sign in with case-insensitive email
            steps:
              - keyword: GIVEN
                content: A saved account has an email address.
              - keyword: WHEN
                content: The visitor signs in using different email casing.
              - keyword: THEN
                content: Login succeeds and the session persists.
          - name: Reject wrong or incomplete credentials
            steps:
              - keyword: GIVEN
                content: The identifier or password is missing or incorrect.
              - keyword: WHEN
                content: The visitor submits Login.
              - keyword: THEN
                content: The same generic error is shown.
          - name: Reject unknown account
            steps:
              - keyword: GIVEN
                content: No account matches the identifier.
              - keyword: WHEN
                content: The visitor submits Login.
              - keyword: THEN
                content: The visitor remains signed out.
          - name: Trim account identifier
            steps:
              - keyword: GIVEN
                content: The identifier contains surrounding whitespace.
              - keyword: WHEN
                content: The visitor submits valid credentials.
              - keyword: THEN
                content: Login succeeds.
          - name: Trim both username and email identifiers
            steps:
              - keyword: GIVEN
                content: Valid username and email identifiers contain surrounding whitespace.
              - keyword: WHEN
                content: The visitor signs in with each identifier.
              - keyword: THEN
                content: Both normalized identifiers are accepted.

  - id: REQ-2
    name: Search trains and select a journey
    type: FOLDER
    dependencies: []
    description: >-
      Any visitor can search the timetable by origin, destination, and date. Results show matching trains and allow one journey to be opened for booking. Searching does not create an account or booking.
    children:
      - id: REQ-2.1
        name: Search valid criteria and show matching trains
        type: ATOMIC
        dependencies: []
        description: |-
          Function: The home page provides required From, To, Date, and Search controls. Values are trimmed; From and To must differ case-insensitively, and Date must use a published date value. A valid search opens results showing the normalized criteria, result count, and matching train cards with train number, route, times, and Book. Each Book action has an accessible name identifying its train number. Invalid input stays on the home page with an error.

          Required system data: The system must contain a bookable train `G532` from `Shanghai` to `Beijing` on `Sun, May 31`, with Shanghai/ShanghaiHongqiao as its displayed departure location and Beijing/BeijingNan as its displayed arrival location. It must also contain a bookable train `G561` from `Beijing` to `Tianjin` on the same date. Both records must have stable displayed departure and arrival times. Invalid search examples omit From, To, or Date, or use `Shanghai` and ` shanghai ` as the same-city pair.

          Optional visual reference: ![image](./reference/search-form.png) ![image](./reference/search-results.png)
        scenarios:
          - name: Show matching trains
            steps:
              - keyword: GIVEN
                content: The timetable contains a train matching the entered route and date.
              - keyword: WHEN
                content: The visitor searches with valid criteria, optionally surrounded by spaces.
              - keyword: THEN
                content: Results show normalized criteria and only the matching train cards.
          - name: Reject incomplete search input
            steps:
              - keyword: GIVEN
                content: A required search field is missing.
              - keyword: WHEN
                content: The visitor clicks Search.
              - keyword: THEN
                content: The home page shows an error and no result list.
          - name: Trim search values
            steps:
              - keyword: GIVEN
                content: Search criteria contain surrounding whitespace.
              - keyword: WHEN
                content: The visitor searches a published route.
              - keyword: THEN
                content: The normalized criteria and matching train are shown.
          - name: Search a second supported route
            steps:
              - keyword: GIVEN
                content: A second published route exists.
              - keyword: WHEN
                content: The visitor searches that route.
              - keyword: THEN
                content: Its matching result is shown.
          - name: Search supported routes with normalized criteria
            steps:
              - keyword: GIVEN
                content: Multiple supported routes and normalized criteria are available.
              - keyword: WHEN
                content: The visitor searches each supported route.
              - keyword: THEN
                content: Each search shows only its matching train.
          - name: Reject missing search combinations
            steps:
              - keyword: GIVEN
                content: One or more required search fields are missing.
              - keyword: WHEN
                content: The visitor searches.
              - keyword: THEN
                content: An error is shown without results.
          - name: Reject same-city search
            steps:
              - keyword: GIVEN
                content: Origin and destination are the same city.
              - keyword: WHEN
                content: The visitor searches.
              - keyword: THEN
                content: The search is rejected.
      - id: REQ-2.2
        name: Select a train and open its booking entry
        type: ATOMIC
        dependencies:
          - REQ-2.1
        description: |-
          Function: Clicking the Book action identified by a train number opens the booking entry for that exact train and searched date, showing its train number, route, and times. The system must not substitute another result.

          Required system data: The system must provide the two bookable records defined in REQ-2.1: `G532` for `Shanghai` to `Beijing` and `G561` for `Beijing` to `Tianjin`, both on `Sun, May 31`.

          Optional visual reference: ![image](./reference/search-results.png) ![image](./reference/booking-page.png)
        scenarios:
          - name: Open the selected train
            steps:
              - keyword: GIVEN
                content: Search results contain a bookable train.
              - keyword: WHEN
                content: The visitor clicks that train's Book button.
              - keyword: THEN
                content: The booking entry shows the same train, route, times, and date.
          - name: Open each supported route
            steps:
              - keyword: GIVEN
                content: Search results contain either supported bookable route.
              - keyword: WHEN
                content: The visitor clicks Book on the selected train.
              - keyword: THEN
                content: The booking page preserves the exact train and date for that route.
  - id: REQ-3
    name: Create and view a booking
    type: FOLDER
    dependencies:
      - REQ-1
      - REQ-2
    description: >-
      A signed-in user can review the selected train, enter passenger and ticket details, and confirm one persistent booking. Invalid or unauthorized actions create no booking.
    children:
      - id: REQ-3.1
        name: Display a selected train on the protected booking page
        type: ATOMIC
        dependencies:
          - REQ-1.2
          - REQ-2.2
        description: |-
          Function: For a signed-in user, the Booking page shows the selected train number, route, times, and date above Passenger information and the booking form. Opening the page is read-only. A signed-out visitor must sign in and cannot submit; missing or unavailable train context shows the REQ-2.2 error instead of the form.

          Required system data: The system must allow creation of a unique REQ-1.1 account and provide the bookable `G532` (`Shanghai` to `Beijing`) and `G561` (`Beijing` to `Tianjin`) journeys on `Sun, May 31`. The selected train summary must display the corresponding train number, cities or stations, times, and date. The signed-out case uses the same valid selected journey after the account signs out.
        scenarios:
          - name: Show the selected journey
            steps:
              - keyword: GIVEN
                content: A signed-in traveler selected a published train.
              - keyword: WHEN
                content: The Booking page opens.
              - keyword: THEN
                content: It shows the selected train summary and Passenger information without creating a booking.
          - name: Preserve summaries across journeys
            steps:
              - keyword: GIVEN
                content: A signed-in traveler opens booking entries for different supported trains.
              - keyword: WHEN
                content: The traveler changes the selected journey before submitting.
              - keyword: THEN
                content: Each booking page shows the corresponding train summary without mixing route or date data.
          - name: Block a signed-out visitor
            steps:
              - keyword: GIVEN
                content: A visitor has a valid selected journey but no session.
              - keyword: WHEN
                content: The visitor opens its booking page.
              - keyword: THEN
                content: The page requests sign-in and provides no working submission action.

      - id: REQ-3.2
        name: Confirm passenger details and create one booking record
        type: ATOMIC
        dependencies:
          - REQ-3.1
        description: |-
          Function: The booking form requires Passenger name, ID number, Nationality, Ticket class, Ticket type, and Terms of service acceptance. Trimmed name and nationality must contain 2–100 and 2–60 visible characters; ID number must contain 6–30 ASCII letters, digits, or hyphens. Place order opens a summary; Confirm creates exactly one booking and shows its booking number and submitted details. Invalid fields create no booking, and repeated confirmation or reload must keep the same record.

          Required system data: Each booking example uses a unique REQ-1.1 account and an independent selected journey. The system must provide `G532` from `Shanghai` to `Beijing` and `G561` from `Beijing` to `Tianjin` on `Sun, May 31`. Valid booking data is (1) passenger `Nguyen Duc Minh`, ID `C612345677`, nationality `Vietnam`, class `standing ticket`, type `Adult`; and (2) passenger `Chen Li`, ID `D712345678`, nationality `Vietnam`, class `Business Class`, type `Adult`. Invalid examples use name `A`, ID `12345`, an empty nationality, or unchecked terms. Ticket class and type are selected explicitly rather than relying on defaults. Confirmation state and booking IDs must remain independent between accounts.

          Optional visual reference: ![image](./reference/booking-page.png)
        scenarios:
          - name: Create one valid booking
            steps:
              - keyword: GIVEN
                content: A signed-in traveler has an isolated account and selected journey.
              - keyword: WHEN
                content: The traveler enters valid details, accepts the terms, reviews the summary, and confirms.
              - keyword: THEN
                content: One booking number and the submitted journey, passenger, and ticket details are shown and persist after reload.
          - name: Create supported ticket variants
            steps:
              - keyword: GIVEN
                content: A signed-in traveler selects a supported route and ticket class such as standing ticket or Business Class.
              - keyword: WHEN
                content: The traveler submits valid passenger details and confirms the order.
              - keyword: THEN
                content: One booking is created with the selected route, class, and passenger details.
          - name: Reject invalid passenger details
            steps:
              - keyword: GIVEN
                content: A required field is missing or invalid, or terms are not accepted.
              - keyword: WHEN
                content: The traveler clicks Place order.
              - keyword: THEN
                content: The form shows an error and opens neither the confirmation summary nor a booking.
          - name: Reject multiple invalid combinations
            steps:
              - keyword: GIVEN
                content: Several passenger fields are invalid in turn.
              - keyword: WHEN
                content: The traveler attempts each order.
              - keyword: THEN
                content: Each attempt is rejected without a booking.
          - name: Reject short passenger values
            steps:
              - keyword: GIVEN
                content: Passenger name or ID is shorter than the documented minimum.
              - keyword: WHEN
                content: The traveler attempts to place the order.
              - keyword: THEN
                content: Validation errors are shown and no booking or confirmation summary is created.
          - name: Create a booking with another seat type
            steps:
              - keyword: GIVEN
                content: A valid traveler selects another supported seat type.
              - keyword: WHEN
                content: The traveler confirms the order.
              - keyword: THEN
                content: The selected seat type is persisted.
