  - id: REQ-2-3
    name: Grant Repository Access to People and Teams
    type: ATOMIC
    dependencies:
    - REQ-2-1-2
    - REQ-2-2-1
    description: From the repository's “Settings” link, open the “Manage access” link
      and activate “Add people or teams”. The picker presents a textbox “Search”,
      a matching selectable team option whose name contains the team name, a combobox
      “Role” with clickable role options including “Write”, and an “Add” button. While
      the picker is active, hide the opening Add people or teams button from the active
      view so the submit action is unambiguous. After saving, the authorization list
      visibly shows the exact team name and Write role and retains the team after
      reload. Existing grants appear as rows whose accessible names include the subject
      name; each row contains a native select labeled “Role” and a “Save” button.
      Selecting the option labeled “Read” and saving replaces Write; after reload
      exactly one row for the team remains and contains Read. The creation scenario
      supplies a repository Admin and an organization team not yet granted access;
      the replacement scenario supplies a separate repository/team with an existing
      Write grant. An organization Owner or repository Admin may grant a repository
      role of Read, Triage, Write, Maintain, or Admin to a current organization member
      or team. In the access-subject picker, matching member or team options update
      as the administrator types; pressing Enter or activating a separate search button
      is not required before selecting an option. A private repository is accessible
      only to an organization Owner, a member with a direct repository role, or a
      direct member of a team that has a repository role; an ordinary organization
      Member has no default private-repository access. For a given subject and repository,
      only one direct role grant is stored — saving the same role again does not create
      a second record, and changing the role replaces the original role. An account's
      effective repository role is the highest among Admin from Owner status and all
      still-valid direct grants and team grants; team hierarchy does not propagate
      membership or authorization. The system stores the authorization subject, repository,
      role, grantor, and timestamp and authorizes operations according to the ROOT
      role matrix; unauthorized accounts cannot see private repositories. This feature
      builds on the persisted objects, opened pages, or authenticated-session context
      provided by REQ-2-1-2 (Create an Organization After Authentication) and REQ-2-2-1
      (Create an Organization Team); it must reuse that context and keep pages and
      data consistent after the context changes.
    scenarios:
    - name: 'REQ-2-3: Grant Repository Access to People and Teams - Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is organization `Acme Demo`, repository
          `acme-docs`, member `bob-reviewer`, team `frontend-team`. An organization
          Owner or repository Admin is signed in and has opened the “Manage access”
          page of a private organization repository; the organization contains one
          member and one team, neither of which currently has a direct grant on that
          repository. Seed values: organization `Acme Demo`, repository `acme-docs`,
          member `bob-reviewer`, team `frontend-team`.'
      - keyword: WHEN
        content: 'The administrator selects the member or team, selects the “Write”
          role, and clicks “Add” or “Save”. Seed values: organization `Acme Demo`,
          repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
      - keyword: THEN
        content: 'The authorization list displays exactly one “Write” role record
          for that subject; when the member or a member of the team opens the repository,
          they can view repository content and perform operations allowed by the Write
          role, while accounts that were not granted permission do not gain that access.
          Seed values: organization `Acme Demo`, repository `acme-docs`, member `bob-reviewer`,
          team `frontend-team`.'
      - keyword: THEN
        content: 'After refreshing the “Manage access” page, the grant still exists;
          saving the same role again for the same subject does not generate a second
          authorization record. Seed values: organization `Acme Demo`, repository
          `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
    - name: 'REQ-2-3: Grant Repository Access to People and Teams - Scenario 2'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is organization `Acme Demo`, repository
          `acme-docs`, member `bob-reviewer`, team `frontend-team`. An administrator
          opens a repository-access management page where a grant has already been
          saved for a team. Seed values: organization `Acme Demo`, repository `acme-docs`,
