            Seed values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
  - id: REQ-6-3
    name: Pull Request Review Workspace
    type: FOLDER
    dependencies:
    - REQ-6-2-3
    description: Supports viewing the overview, commits, changed files, and diffs
      on a pull-request detail page, and adding review comments or submitting review
      decisions on specific files and line ranges in the diff. Read may view; users
      with Write, Maintain, or Admin who are not the PR author may comment on an Open
      PR and submit Comment, Approve, or Request changes; Draft does not allow review
      submission. An inline comment must store the target PR, compare commit, file
      path, line position, author, and body; a review decision must store the reviewer,
      current compare commit, status, and explanation. Each reviewer has only one
      effective decision on a given current compare commit; a new decision replaces
      the reviewer's effective decision while preserving history. Viewing operations
      are read-only, and if comment or review submission fails, it must not be displayed
      as published. This feature builds on the persisted objects, opened pages, or
      authenticated-session context provided by REQ-6-2-3 (Create a Pull Request from
      Comparison Results); it must reuse that context and keep pages and data consistent
      after the context changes.
