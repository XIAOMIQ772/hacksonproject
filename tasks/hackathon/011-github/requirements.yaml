- id: REQ-2
  name: Organization and Governance
  type: FOLDER
  dependencies:
  - REQ-1-1-2
  description: Signed-in users enter the organization list through “Your organizations”
    in the account menu and can create or open an organization; visitors can only
    view public repositories through public organization pages. The organization overview
    provides Repositories, People, and Teams entries. An organization Owner directly
    adds or removes members on People, creates teams and maintains hierarchy on Teams,
    and grants roles to members or teams in Manage access under repository Settings.
    Organization membership only determines whether a user can see the organization
    and can be a candidate for team/repository authorization; it does not automatically
    grant access to any private repository. Access to a private repository comes only
    from organization Owner status, a direct role grant on that repository, or direct
    membership in a team authorized for that repository. All changes must be reflected
    simultaneously in organization details, people/team lists, and the actual access
    results of affected repositories.
  children:
  - id: REQ-2-1
    name: Organization Identity and Discovery
    type: FOLDER
    dependencies:
    - REQ-1-1-2
    description: The organization overview page uses the organization name as a heading;
      its “Repositories”, “People”, and “Teams” navigation entries have link roles
      even when visually styled as tabs. The Repositories tab lists repositories owned
      by the organization, the People tab lists members and their Member/Owner roles,
      and the Teams tab lists teams. This module supports visitors discovering an
      organization's public repositories and signed-in accounts creating organizations
      from the “Your organizations” page. The unique organization name uses the same
      globally unique 1–39-character lowercase ASCII format as the REQ-1 username;
      the display name must contain 1–100 non-empty characters after trimming leading
      and trailing whitespace. After successful creation, the system stores the organization
      object and the creating account's Owner membership relationship, and the user
      enters the new organization overview page; subsequent team, member, and organization-repository
      authorization is scoped by this organization identifier. This feature builds
      on the persisted objects, opened pages, or authenticated-session context provided
      by REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context
      and keep pages and data consistent after the context changes.
    children:
    - id: REQ-2-1-1
      name: Browse Organization Repositories
      type: ATOMIC
      dependencies: []
      description: |-
        The organization page presents “Repositories” as a navigation link, visually usable as a tab, and a textbox labeled “Find a repository”. Filtering updates the visible results as the user types, without a separate submit action. Each result has a link named exactly with the repository name, and opens a heading displaying “organization name/repository name”. Returning with browser Back keeps the public result available; filtering by the exact private repository name never exposes its link to a visitor. The seed organization has a public repository and a distinct private repository inaccessible to visitors. From the organization page, the user clicks the “Repositories” link, can enter a repository name in the filter box, select a public/private filter, and click a repository name in the list to open its overview. The system displays only the names, descriptions, visibility, and update times of repositories visible to the current user; clicking a result opens that repository's overview. Visitors can view public repositories on a public organization overview page; signed-in accounts can see only repositories for which they have read permission on the Repositories tab of the organization overview. The list reads repository name, description, visibility, and update time and provides no write operations; private repositories must first be validated under the already defined repository-access rules.

        Screenshot reference:
        ![image](reference/github-organization-repositories.png)
      scenarios:
      - name: 'REQ-2-1-1: Browse Organization Repositories - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data includes the existing organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. A visitor has
            opened the overview page of a public organization, or a signed-in organization
            member has opened that organization''s overview page; the organization
            contains both a public repository and a private repository that the visitor
            is not authorized to view. Seed values: organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: WHEN
          content: 'The user clicks the “Repositories” tab, enters the full name of
            the public repository in the filter box, selects the “Public” filter,
            and clicks the repository name. Seed values: organization `Acme Demo`,
            repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'The list shows only the name, description, visibility, and update
            time of repositories visible to the current user; the visitor cannot see
            the private repository name, and clicking the public repository opens
            the repository overview page titled “organization name/repository name”.
            Seed values: organization `Acme Demo`, repository `acme-docs`, member
            `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After returning to the organization page or refreshing it, the
            filtered results still do not reveal unauthorized repositories; if the
            visitor opens the private repository from the visible repository list, the system requires
            sign-in or displays that access is not permitted. Seed values: organization
            `Acme Demo`, repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
      - name: 'REQ-2-1-1: Browse Organization Repositories - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. The visitor
            starts at the application home page in a fresh unauthenticated browser
            session. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the browse organization repositories
            workflow. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the browse
            organization repositories workflow. Seed values: organization `Acme Demo`,
            repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
    - id: REQ-2-1-2
      name: Create an Organization After Authentication
      type: ATOMIC
      dependencies:
      - REQ-1-1-2
      description: The account-menu link “Your organizations” opens a page with the
        link “New organization”. Its form has fields labeled “Organization name” and
        “Display name” and a button “Create organization”. The new overview uses a
        heading containing the organization identifier, which remains after reload.
        Submitting an existing identifier must show “Organization name already exists”
        even when the display name is also missing; it must not navigate to a heading
        for the existing organization. The malformed identifier “-invalid-organization”
        and a whitespace-only display name are rejected with the applicable field
        error. Seed data supplies a verified creator and an existing organization
        identifier for the duplicate case. A signed-in user enters a unique organization
        name and display information on the organization-creation page and confirms.
        The organization name must comply with the 1–39-character lowercase ASCII
        REQ-1 username format and be globally unique; the display name must contain
        1–100 non-empty characters after trimming leading and trailing whitespace.
        The system validates these rules, creates the organization identifier, display
        name, and creation time, and saves the current user as both initial owner
        and member; if the name or display name is noncompliant, the name conflicts,
        or persistence fails, the system retains non-sensitive input, displays the
        reason in the corresponding field, and does not create the organization. The
        applicable visible message is “Organization name already exists”, “Organization
        name format is invalid”, or “Display name is required”. On success, the user
        is redirected to the new organization overview page, the organization appears
        in the current user's accessible-organization list, and subsequent team, member,
        and repository authorization is scoped by that organization identifier. This
        feature builds on the persisted objects, opened pages, or authenticated-session
        context provided by REQ-1-1-2 (Sign In with an Existing Account); it must
        reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: 'REQ-2-1-2: Create an Organization After Authentication - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. A signed-in
            user enters the “Your organizations” page from the account menu and clicks
            “New organization”; the candidate organization identifier is `mobile-guild`
            and does not exist
            in the system, and the creation form displays organization-identifier
            and display-name fields. Seed values: organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: WHEN
          content: 'The user enters organization identifier `mobile-guild`, a display
            name `Mobile Guild`, and clicks “Create organization”. Seed values:
            organization `Acme Demo`, repository `acme-docs`, member `bob-reviewer`,
            team `frontend-team`.'
        - keyword: THEN
          content: 'The system enters the new organization overview page, whose title
            displays the organization identifier; the current user is shown as Owner
            and organization member, and the organization appears in the “Your organizations”
            list. Seed values: organization `Acme Demo`, repository `acme-docs`, member
            `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After refreshing the overview page and reopening the organization
            list, the organization still exists; if the organization identifier is
            duplicated, malformed, or the display name is empty, the corresponding
            field displays the reason and no organization is created. Seed values:
            organization `Acme Demo`, repository `acme-docs`, member `bob-reviewer`,
            team `frontend-team`.'
      - name: 'REQ-2-1-2: Create an Organization After Authentication - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. The visitor
            starts at the application home page in a fresh unauthenticated browser
            session. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the create an organization after authentication
            workflow. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the create
            an organization after authentication workflow. Seed values: organization
            `Acme Demo`, repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
      - name: 'REQ-2-1-2: Create an Organization After Authentication - Scenario 3'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. The visitor
            starts at the application home page in a fresh unauthenticated browser
            session. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the create an organization after authentication
            workflow. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the create
            an organization after authentication workflow. Seed values: organization
            `Acme Demo`, repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
  - id: REQ-2-2
    name: Team and Member Management
    type: FOLDER
    dependencies:
    - REQ-2-1-2
    description: On the current organization's member- and team-management pages,
      users create teams, maintain team hierarchy and membership relationships, and
      directly add or remove organization members. A team name contains 1–50 lowercase
      ASCII letters, digits, or hyphens, may not begin or end with a hyphen, and must
      be unique within the same organization; a team must belong to an organization,
      and a parent team must belong to the same organization and may not create a
      direct or indirect cycle. Organization membership and team membership are independent
      persisted relationships; team hierarchy is used only for display and management
      and does not implicitly add members of a parent or child team to the other team.
      On the People page, an Owner enters the username or verified email of an existing
      account and confirms, after which the system immediately saves that account's
      Member or Owner membership relationship; there is no invitation, Pending, or
      acceptance step. When removing a member, the system atomically deletes that
      organization-membership relationship, all of that account's team memberships
      in the organization, and all direct grants to that account on repositories of
      the organization; team grants themselves are not deleted. If removal would leave
      the organization with no Owner, the system rejects the operation and keeps all
      relationships unchanged; the person's account, personal repositories, and relationships
      with other organizations must not be deleted. This feature builds on the persisted
      objects, opened pages, or authenticated-session context provided by REQ-2-1-2
      (Create an Organization After Authentication); it must reuse that context and
      keep pages and data consistent after the context changes.
    children:
    - id: REQ-2-2-1
      name: Create an Organization Team
      type: ATOMIC
      dependencies:
      - REQ-2-1-2
      description: The organization overview has a “Teams” link; that page has a “New
        team” link opening the field “Team name” and button “Create team”. A unique
        compliant name can be submitted without a description or parent. The resulting
        team heading contains its name and remains visible after reload. Seed data
        supplies an organization and an account with Owner permission. A team page
        is the detail page for a grouping of accounts within an organization, titled
        “organization name/team name”; the Members tab displays the team's direct
        members, and Settings is used to change the parent team. Only an organization
        Owner can click “New team” from the Teams tab on the organization overview.
        The system stores the team identifier, owning organization, name, optional
        description, optional parent team, creator, and timestamp; if the team name
        is missing, malformed, duplicated, the parent team does not belong to the
        current organization, or creation fails, no team is generated. A malformed
        team name displays “Team name format is invalid”. This feature builds on the
        persisted objects, opened pages, or authenticated-session context provided
        by REQ-2-1-2 (Create an Organization After Authentication); it must reuse
        that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: 'REQ-2-2-1: Create an Organization Team - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. An organization
            Owner is signed in and has opened “Teams” from the organization overview
            page; the organization may already contain a parent team, and the target
            team name `mobile-team` is not yet used in that organization. Seed values: organization
            `Acme Demo`, repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: WHEN
          content: 'The Owner clicks “New team”, enters team name `mobile-team`, which
            is 1 to 50 characters
            long containing only lowercase ASCII letters, digits, or hyphens and not
            beginning or ending with a hyphen, optionally enters a description and
            a parent team from the same organization, then clicks “Create team”. Seed
            values: organization `Acme Demo`, repository `acme-docs`, member `bob-reviewer`,
            team `frontend-team`.'
        - keyword: THEN
          content: 'The system redirects to the new team page, whose title displays
            “organization name/team name”; the team tree displays its organization
            and selected parent team. If the name is empty, malformed, duplicated,
            or the parent team does not belong to the organization, an error is displayed
            and no team is created. Seed values: organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After refreshing the team page or reopening the “Teams” list,
            the new team and its parent-child relationship remain consistent. Seed
            values: organization `Acme Demo`, repository `acme-docs`, member `bob-reviewer`,
            team `frontend-team`.'
      - name: 'REQ-2-2-1: Create an Organization Team - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. The visitor
            starts at the application home page in a fresh unauthenticated browser
            session. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the create an organization team workflow.
            Seed values: organization `Acme Demo`, repository `acme-docs`, member
            `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the create
            an organization team workflow. Seed values: organization `Acme Demo`,
            repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: organization `Acme Demo`, repository `acme-docs`,
            member `bob-reviewer`, team `frontend-team`.'
    - id: REQ-2-2-2
      name: Manage Organization Team Members and Hierarchy
      type: ATOMIC
      dependencies:
      - REQ-2-2-1
      description: Only an organization Owner may maintain members or hierarchy on
        an organization team page. The team maintainer in these scenarios is an organization
        Owner. The team page has links “Members” and “Settings”. On Members, the button
        “Add member” opens a textbox labeled “Username” and the submit button “Add
        member”; only the current step's Add member button is exposed as an actionable
        match. After adding, the member's complete username is visible once in the
        member list, alongside a button named “Remove <username>”. Activating this
        removal button immediately removes that member without a second confirmation
        step, and reload keeps the username absent. Settings contains a native select
        with combobox role labeled “Parent team”, whose option labels are team names,
        and a button “Save”. The original parent remains selected after a rejected
        change and reload. The cycle scenario supplies a team with an existing parent
        and a descendant selectable by name; submitting that descendant shows the
        cycle error rather than saving it. The seed record's original-parent value identifies
        the stored selection, which may differ from its display label. The membership
        scenario supplies a current organization member not yet in this team. On the
        team page, the Owner clicks “Members” to add or remove current organization
        members, or selects a new parent team in “Settings” and saves. The system
        stores the team-membership relationship or team hierarchy and immediately
        reflects it in the organization team tree and member list; team hierarchy
        creates no implicit membership relationship or repository permission, and
        cyclic hierarchy is prohibited. A rejected cycle displays “Cyclic team hierarchy
        is not allowed”. This feature builds on the persisted objects, opened pages,
        or authenticated-session context provided by REQ-2-2-1 (Create an Organization
        Team); it must reuse that context and keep pages and data consistent after
        the context changes.
      scenarios:
      - name: 'REQ-2-2-2: Manage Organization Team Members and Hierarchy - Scenario
          1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is organization `Acme Demo`, repository
            `acme-docs`, member `bob-reviewer`, team `frontend-team`. A signed-in
            team maintainer opens a team page within an organization; there is an
            organization member who has not yet joined the team and a candidate parent
            team in the same organization that would not create a cycle. The member is
            `bob-reviewer` and the team is `frontend-team`. Seed values:
            organization `Acme Demo`, repository `acme-docs`, member `bob-reviewer`,
            team `frontend-team`.'
        - keyword: WHEN
          content: 'On the “Members” page, the maintainer uses “Add member” to precisely
            search for and add that organization member, then selects the candidate
            parent team in “Settings” and saves; the maintainer subsequently removes
            the just-added member from the member action menu. Seed values: organization
            `Acme Demo`, repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After addition, the member list displays the account; after saving,
            the team tree displays the new parent-child relationship; after removal,
            the account no longer appears in the member list. Non-organization members
            cannot be added, and any selection that would make the team its own parent
            or the parent of one of its ancestors is rejected. Seed values: organization
            `Acme Demo`, repository `acme-docs`, member `bob-reviewer`, team `frontend-team`.'
        - keyword: THEN
          content: 'After refreshing the member page and organization team tree, the
            page displays only successfully saved parent-team and membership relationships.
            Seed values: organization `Acme Demo`, repository `acme-docs`, member
            `bob-reviewer`, team `frontend-team`.'
