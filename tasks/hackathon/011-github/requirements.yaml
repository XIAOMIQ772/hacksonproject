          displays the new file and its content. Seed values: repository `acme-docs`,
          branches `main` and `feature-search`, file `README.md`, commit `Document
          search flow`.'
      - keyword: THEN
        content: 'After refreshing the file page and commit history, the new file
          and commit still exist; if the path is empty, begins with `/`, contains
          `..`, conflicts with an existing file, the commit message is noncompliant,
          the branch is protected, or persistence fails, the system displays the reason
          and leaves the file, branch head, and history unchanged. Seed values: repository
          `acme-docs`, branches `main` and `feature-search`, file `README.md`, commit
          `Document search flow`.'
    - name: 'REQ-4-4: Manage Repository Files Through the Web Interface - Scenario
        2'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is repository `acme-docs`, branches `main`
          and `feature-search`, file `README.md`, commit `Document search flow`. The
          visitor starts at the application home page in a fresh unauthenticated browser
          session. Seed values: repository `acme-docs`, branches `main` and `feature-search`,
          file `README.md`, commit `Document search flow`.'
      - keyword: WHEN
        content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
          follows the visible controls for the manage repository files through the
          web interface workflow. Seed values: repository `acme-docs`, branches `main`
          and `feature-search`, file `README.md`, commit `Document search flow`.'
      - keyword: THEN
        content: 'The page displays the required headings, controls, values, and status for the manage repository
          files through the web interface workflow. Seed values: repository `acme-docs`,
          branches `main` and `feature-search`, file `README.md`, commit `Document
          search flow`.'
      - keyword: THEN
        content: 'After refreshing or reopening the visible destination, the successful
          result remains persisted; a rejected action leaves the original state unchanged.
          Seed values: repository `acme-docs`, branches `main` and `feature-search`,
          file `README.md`, commit `Document search flow`.'
- id: REQ-5
  name: Work Planning and Issue Management
  type: FOLDER
  dependencies:
  - REQ-3-3
  description: An issue is a persistent work item within a repository used to record
    pending work, a defect, or a discussion topic; it is not a code file or PR. The
    Issues page is the list page in repository navigation; each row displays the issue
    number, title, Open/Closed status, author, and labels, and clicking the number
    or title opens the issue detail page. At the top of the detail page are the title
    and status; the right side displays Assignees, Labels, and Milestone metadata
    in order; the main area displays the description, comments, and activity timeline.
    The “activity timeline” is an append-only history that records creation, edits,
    comments, assignment, labels, milestone, and status changes in chronological order.
    A label is a pre-existing colored classification name in the current repository;
    a milestone is a pre-existing goal-classification item in the current repository
    that may be associated with multiple issues or PRs but does not change their content
    or status. Write, Maintain, and Admin may create issues, edit titles/descriptions,
    and comment; Triage, Maintain, and Admin may assign participants, apply labels,
    set milestones, and close or reopen issues; Read may only view. Every operation
    is performed around a unique issue number within the repository, and the detail
    page and list display the same persisted data; after refresh, re-login, or opening
    from another account with view permission, the same record is still read. For
    issue operations, the explicit role lists in this module define eligibility per
    operation rather than an implicit cumulative grant from a role's name; Write can
    create, edit, and comment but cannot assign, label, set milestones, or change
    status. Organization Owners act with Admin permission. Read-only seed scenarios
    provide a public repository's visible Issues entry, distinct Open and
    Closed issues with known titles, and an issue entry with known title, description,
    metadata, and discussion. Mutation scenarios provide isolated issues for successful
    editing, invalid-title editing with a known original title, commenting, comment
    validation, assignment, labels, milestone, and closing; their initial states must
    not be changed by another scenario. The author and commenter accounts have Write
    or higher permission; the editor used for both content and metadata operations
    has Maintain or Admin permission. A separate viewer has Read permission on a protected
    issue. All authenticated scenarios use the home-page “Sign in” link, fields labeled
    “Username or email” and “Password”, and the “Sign in” button, after which the
    signed-in username is visible. Named controls below are unique on the active page
    unless a narrower scope is stated; detail pages and reloads must work independently
    of earlier list navigation.
  children:
  - id: REQ-5-1
    name: Issue Discovery and Details
    type: FOLDER
    dependencies:
    - REQ-3-3
    description: The Issues list page displays issues within the current repository;
      status, keyword, and label filters only change the rows currently displayed
      in the browser and do not write or delete issues. The issue detail page is the
      complete view of the work item with the same number, aggregating the description,
      right-side metadata, comments, and activity timeline, and also serves as the
      common entry point for editing, commenting, assigning, labeling, setting milestones,
      and closing/reopening. This feature builds on the persisted objects, opened
      pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository
      Overview); it must reuse that context and keep pages and data consistent after
      the context changes.
    children:
    - id: REQ-5-1-1
      name: List and Filter Repository Issues
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: |-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes. Users with repository-view permission can read issue rows for the current repository on the Issues list page; each row references a persisted issue number and displays the title, status, author, labels, and update time. Users can filter by Open/Closed, title or body keywords, and labels; when the user types in the issue search box, the matching issue rows update without requiring Enter or a separate search button. Filtering does not create or modify work items. “Open” and “Closed” are links, not buttons or tabs. A unique searchbox named “Search issues” filters as the user types, including when the entire seeded title is entered. Each result title is a link whose exact accessible name is the title. Open plus the known open title shows that issue and continues to show it after reload; Closed plus the known closed title shows the closed issue and excludes the open issue. State and keyword filters combine, and refreshing retains the chosen filter context and matching results.

        The seeded closed issue title is `Legacy welcome text`.

        Screenshot reference:
        ![image](reference/github-issues-list.png)
      scenarios:
      - name: 'REQ-5-1-1: List and Filter Repository Issues - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            The user has opened the “Issues” page of an accessible repository; the
            list contains an Open issue with the `bug` label and a unique word in
            its title, and a Closed issue with the same label. Seed values: repository
            `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user selects “Open”, enters the unique word, and selects `bug`
            in the label filter. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The list displays only the matching Open issue, and each row displays
            its number, title, label, author, and status; clicking the title opens
            that issue''s detail page. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
        - keyword: THEN
          content: 'After switching to “Closed”, the Open issue is not shown and the
            matching Closed issue is shown; filtering only changes list display and
            does not change any issue data. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
      - name: 'REQ-5-1-1: List and Filter Repository Issues - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A user with repository-view permission is viewing rows containing both
            Open and Closed issues on the current repository''s Issues list page.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The participant switches to the Closed-status filter and searches
            for the title of a closed issue. Seed values: repository `acme-docs`,
            issue `Improve onboarding`, labels `bug` and `documentation`, milestone
            `Q3 launch`.'
        - keyword: THEN
          content: 'The system displays only the matching closed issue and keeps issue
            data unchanged after reload. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
    - id: REQ-5-1-2
      name: View an Issue and Its Discussion
      type: ATOMIC
      dependencies:
      - REQ-5-1-1
      description: An issue detail page is the read view for a uniquely numbered work
        item within a repository — the top displays the number, a heading whose exact
        accessible name is the complete title without the issue number, and visible
        status text “Open” or “Closed”; the body displays the complete saved description
        as readable text; the right side displays assignees, labels, and milestone;
        and the bottom displays sections or records containing “Comment” or “Activity”
        text over time. Any user with repository-view permission may read this saved
        data, but the page displays editable controls only to users with the corresponding
        role. The seeded open issue title is `Improve onboarding` and its description is
        `Describe the onboarding improvement.` This feature builds on the persisted objects,
        opened pages, or authenticated-session
        context provided by REQ-5-1-1 (List and Filter Repository Issues); it must
        reuse that context and keep pages and data consistent after the context changes.
      scenarios:
      - name: 'REQ-5-1-2: View an Issue and Its Discussion - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            The user sees an Open issue in the issue list of an accessible repository;
            the issue has a title, description, one label, one assignee, and at least
            one comment. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user clicks the issue number or title and scrolls through
            the discussion timeline. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The detail page displays the repository-scoped issue number, title,
            Open status, description, label, assignee, comment author, and comment
            body, and displays creation and comment activities in chronological order.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'After refreshing or reopening the same number from the list, the
            same title, status, metadata, and saved comments are displayed; users
            without repository access cannot view the detail content. Seed values:
            repository `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
      - name: 'REQ-5-1-2: View an Issue and Its Discussion - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            The visitor starts at the application home page in a fresh unauthenticated
            browser session. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the view an issue and its discussion
