            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the view an
            issue and its discussion workflow. Seed values: repository `acme-docs`,
            issue `Improve onboarding`, labels `bug` and `documentation`, milestone
            `Q3 launch`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
      - name: 'REQ-5-1-2: View an Issue and Its Discussion - Scenario 3'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            The visitor starts at the application home page in a fresh unauthenticated
            browser session. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the view an issue and its discussion
            workflow. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the view an
            issue and its discussion workflow. Seed values: repository `acme-docs`,
            issue `Improve onboarding`, labels `bug` and `documentation`, milestone
            `Q3 launch`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
  - id: REQ-5-2
    name: Issue Creation and Discussion
    type: FOLDER
    dependencies:
    - REQ-5-1-2
    description: Supports creating issues in the current repository, editing titles
      and descriptions, and appending discussion comments. An issue title contains
      1–256 non-empty characters after trimming leading and trailing whitespace; the
      description may be empty and is at most 65536 characters; a comment contains
      1–65536 non-empty characters after trimming leading and trailing whitespace.
      After successful creation, the issue is assigned a unique repository-scoped
      number and the detail page opens; editing changes only the current fields of
      the target issue, while comments are appended to the activity timeline as independent
      records with author and timestamp. On insufficient permission, empty required
      fields, overlong input, or persistence failure, the system must not create an
      empty issue, overwrite the original description, or append a partial comment.
      This feature builds on the persisted objects, opened pages, or authenticated-session
      context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse
      that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-5-2-1
      name: Create a Repository Issue
      type: ATOMIC
      dependencies:
      - REQ-3-3
      - REQ-1-1-2
      description: |-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. A signed-in user with Write, Maintain, or Admin clicks “New issue” from the current repository's Issues list page to open the creation form, enters a non-empty title and optional description, and submits. The system assigns an incrementing unique issue number within the repository, stores the repository identifier, title, description, author, creation time, and Open status, and appends a creation activity; on failure, it does not allocate a number or persist partial data. On success, the system redirects to the new issue detail page, and the list can locate the issue by its new number and status. “New issue” is a link on the Issues page. The creation form has fields labeled “Title” and “Description” and a “Submit new issue” button. A successful submission displays a heading named exactly after the entered title and the exact saved description; reopening the Issues page entry shows a title link with the same exact name. A title containing only three spaces is treated as blank; clicking Submit new issue displays “Title is required” and creates no issue, even if the optional description is empty.

        Screenshot reference:
        ![image](reference/github-new-issue.png)
      scenarios:
      - name: 'REQ-5-2-1: Create a Repository Issue - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A signed-in user with issue-write permission opens the repository''s “Issues”
            page; the current maximum issue number is known, and the candidate title
            is not currently used on the page. Seed values: repository `acme-docs`,
            issue `Improve onboarding`, labels `bug` and `documentation`, milestone
            `Q3 launch`.'
        - keyword: WHEN
          content: 'The user clicks “New issue”, enters a title whose trimmed length
            is 1 to 256 and an optional description, then clicks “Submit new issue”.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The system redirects to the new issue detail page, displaying
            a unique incrementing repository-scoped number, Open status, the entered
            title and description, and the current user as author; the activity timeline
            contains a creation record. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
        - keyword: THEN
          content: 'After returning to the issue list, the item can be found by its
            new number; if the title is blank, exceeds 256 characters, the user lacks
            write permission, or submission fails, the system displays the reason
            and adds neither a new issue nor a new number. Seed values: repository
            `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
      - name: 'REQ-5-2-1: Create a Repository Issue - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            The visitor starts at the application home page in a fresh unauthenticated
            browser session. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the create a repository issue workflow.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the create
            a repository issue workflow. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
    - id: REQ-5-2-2
      name: Edit an Issue Title and Description
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: Only a signed-in user with Write, Maintain, or Admin may use the
        unique buttons named “Edit issue title” and “Edit issue description” on an
        issue detail page. “Edit issue title” opens a form with a textbox labeled
        “Issue title” and a button named “Save issue title”; “Edit issue description”
        opens a form with a textbox labeled “Issue description” and a button named
        “Save issue description”. Read and Triage may only view, these edit controls
        are unavailable, and the server rejects their submissions. The system updates
        only the title or description of the target issue and stores the editor, edit
        time, and new value, displaying the change in details, list summaries, and
        the activity timeline; for an empty title, overlong input, or save failure,
        the original value is retained. Saving title and description are separate
        actions; after both saves and reload, the title heading has exactly the new
        title as its accessible name and the exact new description is visible. The
        invalid-edit seed is a separate issue with the original title `Original issue title`;
        replacing
        its title with three spaces and activating “Save issue title” shows “Title
        is required”, and reloading restores the original title heading. This feature
        builds on the persisted objects, opened pages, or authenticated-session context
        provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that
        context and keep pages and data consistent after the context changes.
      scenarios:
      - name: 'REQ-5-2-2: Edit an Issue Title and Description - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A signed-in user with edit permission opens the detail page of an issue
            that already has a title and description and records the issue number
            and original description. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user clicks “Edit” beside the title, changes the title to
            a valid new value and saves, then clicks “Edit” beside the description,
            changes the description to a valid new value and saves. Seed values: repository
            `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The title and description for the same issue number are updated,
            the issue-list summary displays the new title, and the activity timeline
            records the edits; other issues and this issue''s status, labels, and
            assignees remain unchanged. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
        - keyword: THEN
          content: 'After refreshing the detail page, the new values still exist;
            saving a blank title, input over the length limit, or a failed save retains
            the original value of the corresponding field. Seed values: repository
            `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
      - name: 'REQ-5-2-2: Edit an Issue Title and Description - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A user with edit permission opens an issue detail page whose title can
            be edited. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user clears the title to a blank value and attempts to save.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The system rejects the save, retains the original title, and continues
            to display the original title after reload. Seed values: repository `acme-docs`,
            issue `Improve onboarding`, labels `bug` and `documentation`, milestone
            `Q3 launch`.'
    - id: REQ-5-2-3
      name: Comment on an Issue Discussion
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      - REQ-1-1-2
      description: Only a signed-in user with Write, Maintain, or Admin may enter
        a non-empty comment on the issue detail page of the current repository; all
        signed-in users who can view the issue may add or remove their own reactions
        on an existing issue or comment. The system stores the comment identifier,
        issue identifier, author, body, and creation time, or stores a “subject-target-reaction
        type” association; for the same user, target, and reaction, only one association
        is stored, and selecting it a second time removes it. On success, the new
        comment or reaction is displayed in the discussion and activity timeline;
        on failure, no local fake comment or partial reaction is displayed. The comment
        editor is labeled “Comment”, and its submit button is named exactly “Comment”.
        After submission the complete comment text and author username are visible,
        and the saved comment remains after reload. Discussion and activity entries
        use article semantics so an invalid submission cannot add an article; existing
        entries remain stable across reload. For whitespace-only text the Comment
        button may either be disabled or remain enabled and display “Comment is required”
        when activated. Neither path adds a comment or activity. This feature builds
        on the persisted objects, opened pages, or authenticated-session context provided
        by REQ-5-1-2 (View an Issue and Its Discussion) and REQ-1-1-2 (Sign In with
        an Existing Account); it must reuse that context and keep pages and data consistent
        after the context changes.
      scenarios:
      - name: 'REQ-5-2-3: Comment on an Issue Discussion - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A signed-in user with comment permission opens an issue detail page; the
            timeline already contains a comment to which a reaction can be added.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user enters a non-empty trimmed comment in the comment box
            and clicks “Comment”, then selects a reaction from the reaction menu on
            the existing comment. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The timeline appends a comment displaying the current user, comment
            body, and creation time; the target comment displays the reaction and
            its count, and the same user selecting the same reaction again does not
            create a duplicate reaction. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
        - keyword: THEN
          content: 'After refreshing the detail page, the comment and reaction still
            exist; a blank comment, a comment exceeding 65536 characters, lack of
            comment permission, or publication failure does not append a partial comment
            or timeline record. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
      - name: 'REQ-5-2-3: Comment on an Issue Discussion - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            The user opens an issue discussion page where the comment box and submit
            button are visible. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user enters only whitespace characters in the comment box
            and attempts to submit. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'The system creates no new comment or timeline record, and the
            discussion count remains unchanged after reload. Seed values: repository
            `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
  - id: REQ-5-3
    name: Issue Metadata and Classification
    type: FOLDER
    dependencies:
    - REQ-5-1-2
    description: An “Assignee” is an account assigned to follow up on an issue and
      is displayed on the right side of the detail page; it only stores an association
      between the issue and account and does not change that account's repository
      permission. A “Label” is a preconfigured classification name in the current
      repository and is displayed in the frontend as a label badge; it only stores
      an association between the issue and label. A “Milestone” is a preconfigured
      stage or version goal in the current repository and is displayed as single-select
      metadata on the right side; a work item may be associated with at most one milestone,
      and selecting None deletes that association. This version provides no page or
      interface for creating, editing, or deleting labels or milestones; seeded data
      and initial repositories must provide selectable items. Each relationship addition
      or removal updates the details and activity record and does not automatically
      create cross-repository labels, milestones, or membership relationships. This
      feature builds on the persisted objects, opened pages, or authenticated-session
      context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse
      that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-5-3-1
      name: Assign or Unassign Issue Participants
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: Only a signed-in user with Triage, Maintain, or Admin may click
        the settings icon in the “Assignees” area on the right side of an issue, search
        for and check assignable members, or uncheck selected members and close the
        menu. Matching assignee options update as the user types in the search textbox;
        pressing Enter or activating a separate search button is not required before
        selecting an option. Assignable members are accounts that have at least Triage
        permission on the current repository; the system stores the issue-account
        relationship, operator, and time and records an activity, while non-assignable
        users do not appear in results. The settings icon is a button named “Assignees”;
        the open selector contains a textbox named “Search assignees” and items with
        role option named exactly after the member username. Seed data provides an
        eligible member not initially assigned to the target issue. Clicking the member
        option immediately saves the assignment and closes the selector without a
        separate Save action; the exact username is visible in metadata and remains
        after reload. Reopening Assignees shows the selected member without requiring
        another search; clicking that option again immediately removes the assignment
        and closes the selector so the username is no longer displayed as an assignee.
        Historical assignment and unassignment activities remain historical records.
        Unassignment only deletes that issue relationship and does not delete the
        member account or repository grant; controls are unavailable to users without
        the role and the server rejects their submissions. This feature builds on
        the persisted objects, opened pages, or authenticated-session context provided
        by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context
        and keep pages and data consistent after the context changes.
      scenarios:
      - name: 'REQ-5-3-1: Assign or Unassign Issue Participants - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A signed-in user with issue-maintenance permission opens an issue detail
            page; the repository contains one assignable member and one account outside
            the repository collaborator scope. Seed values: repository `acme-docs`,
            issue `Improve onboarding`, labels `bug` and `documentation`, milestone
            `Q3 launch`.'
        - keyword: WHEN
          content: 'The user clicks the settings icon under “Assignees” on the right,
            searches for and checks the assignable member, closes the menu, then reopens
            it and unchecks that member. Seed values: repository `acme-docs`, issue
            `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3
            launch`.'
        - keyword: THEN
          content: 'After the member is checked, that member appears in the assignee
            area and an assignment activity is recorded; after unassignment, the member
            is no longer displayed and an unassignment activity is recorded. Non-assignable
            accounts do not appear in search results, and unassignment does not delete
            the account. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'After refreshing the detail page, only the final selected-assignee
            set remains; users without maintenance permission cannot save assignee
            changes. Seed values: repository `acme-docs`, issue `Improve onboarding`,
            labels `bug` and `documentation`, milestone `Q3 launch`.'
    - id: REQ-5-3-2
      name: Apply Labels to an Issue
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: Only users with Triage, Maintain, or Admin may apply or remove
        labels that already exist in the current repository; the system stores the
        issue-label relationship and activity record. The sidebar has a button named
        “Labels”, opening options whose exact accessible names are the current repository's
        label names. Seed data provides an existing label not yet applied to the target
        issue. Clicking its option immediately saves the association and closes the
        picker, without requiring a separate Save button; the label name is visible
        on the detail page and remains after reload. Reopening and selecting the same
        option removes the association. The label selector must not create labels,
        display labels from other repositories, or associate labels from other repositories;
        Read and Write users may only view, the control is unavailable, and the server
        rejects their submissions. This feature builds on the persisted objects, opened
        pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue
        and Its Discussion); it must reuse that context and keep pages and data consistent
        after the context changes.
      scenarios:
      - name: 'REQ-5-3-2: Apply Labels to an Issue - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A signed-in user with issue-maintenance permission opens an issue detail
            page; the current repository defines the `bug` and `documentation` labels,
            while another repository contains an external label with the same name.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user opens the selector under “Labels” on the right, checks
            `bug`, saves, then reopens the selector and unchecks `bug`. Seed values:
            repository `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
        - keyword: THEN
          content: 'After selection, the detail page and issue list display the `bug`
            label; after removal, it is no longer displayed. The selector offers only
            labels from the current repository and does not create or associate labels
            from another repository. Seed values: repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: THEN
          content: 'After refreshing the page, the label set matches the last saved
            state; users without permission cannot submit label changes. Seed values:
            repository `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
    - id: REQ-5-3-3
      name: Assign Issues and Pull Requests to a Milestone
      type: ATOMIC
      dependencies:
      - REQ-5-1-2
      description: |-
        On the right side of an issue or pull request, the user clicks the settings icon in the “Milestone” area and selects one item from the current repository's milestone list, or selects “None” to remove the association. The system stores the association between the work item and milestone and updates detail metadata; it does not create a cross-repository milestone. The settings icon is a button named “Milestone”, and selectable items have role option with the exact milestone name as their accessible name. Seed data provides a selectable milestone belonging to the current repository and an issue not yet associated with it. Clicking the option immediately saves the association and closes the picker with no separate confirmation or save action; the exact milestone name remains visible after reload. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse that context and keep pages and data consistent after the context changes. Only users with Triage, Maintain, or Admin may use this capability on repository planning and issue-management pages; Read and Write users may only view the current milestone. The system validates the role and rejects unauthorized submissions.

        Screenshot reference:
        ![image](reference/github-milestones.png)
      scenarios:
      - name: 'REQ-5-3-3: Assign Issues and Pull Requests to a Milestone - Scenario
          1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, issue `Improve
            onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.
            A signed-in user with Triage, Maintain, or Admin opens an issue or pull-request
            detail page; the current repository contains a milestone named `v1.0`,
            while another repository contains a milestone that must not be selectable.
            Seed values: repository `acme-docs`, issue `Improve onboarding`, labels
            `bug` and `documentation`, milestone `Q3 launch`.'
        - keyword: WHEN
          content: 'The user clicks the settings icon in “Milestone” on the right,
            selects `v1.0`, then reopens the selector and chooses “None”. Seed values:
            repository `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
        - keyword: THEN
          content: 'After selection, the detail page displays `v1.0` and records an
            association activity; after selecting “None”, that display is removed.
            The selector does not offer milestones from other repositories and does
            not create cross-repository associations. Seed values: repository `acme-docs`,
            issue `Improve onboarding`, labels `bug` and `documentation`, milestone
            `Q3 launch`.'
        - keyword: THEN
          content: 'After refreshing the detail page, the milestone state matches
            the last saved state; Read or Write users cannot save changes. Seed values:
            repository `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
            milestone `Q3 launch`.'
  - id: REQ-5-4
    name: Close or Reopen an Issue
    type: ATOMIC
    dependencies:
    - REQ-5-1-2
    description: Only users with Triage, Maintain, or Admin may close or reopen an
      issue from the issue detail view; Write and Read users may only view the status.
      The system stores the Open or Closed status, operator, and time, records the
      transition in activity history, and shows it to subsequent viewers; the status
      transition must not modify the title, description, comments, labels, assignees,
      or milestone. The closable seed issue starts Open. The detail page offers a
      “Close issue” button when Open and a “Reopen issue” button when Closed; activating
      either immediately saves the change without an additional confirmation. Closing
      displays Closed status and a “Closed issue” activity, and reopening displays
      Open status. After reopening and reload the “Close issue” button is available
      again. On the separate protected issue, the Read viewer sees neither close nor
      reopen button; hiding both controls is required, in addition to rejecting unauthorized
      requests. This feature builds on the persisted objects, opened pages, or authenticated-session
      context provided by REQ-5-1-2 (View an Issue and Its Discussion); it must reuse
      that context and keep pages and data consistent after the context changes.
    scenarios:
    - name: 'REQ-5-4: Close or Reopen an Issue - Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is repository `acme-docs`, issue `Improve
          onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`. A
          signed-in user with issue-management permission opens an Open issue detail
          page that displays the number, title, and activity timeline. Seed values:
          repository `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
          milestone `Q3 launch`.'
      - keyword: WHEN
        content: 'The user clicks “Close issue”, confirms that the page displays Closed,
          and then clicks “Reopen issue”. Seed values: repository `acme-docs`, issue
          `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
      - keyword: THEN
        content: 'The issue displays Closed and then Open status in sequence, and
          the timeline appends close and reopen events in sequence; the issue number,
          title, description, comments, and metadata do not change because of the
          status transitions. Seed values: repository `acme-docs`, issue `Improve
          onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
      - keyword: THEN
        content: 'After refreshing the detail page and issue list, the final Open
          state remains consistent; for users without management permission, close
          or reopen operations are unavailable or rejected and the status does not
          change. Seed values: repository `acme-docs`, issue `Improve onboarding`,
          labels `bug` and `documentation`, milestone `Q3 launch`.'
    - name: 'REQ-5-4: Close or Reopen an Issue - Scenario 2'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is repository `acme-docs`, issue `Improve
          onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`. A
          signed-in user who can only view the issue and lacks issue-management permission
          opens the issue detail page. Seed values: repository `acme-docs`, issue
          `Improve onboarding`, labels `bug` and `documentation`, milestone `Q3 launch`.'
      - keyword: WHEN
        content: 'The user attempts to close or reopen the issue. Seed values: repository
          `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
          milestone `Q3 launch`.'
      - keyword: THEN
        content: 'Close and reopen operations are unavailable to that user or are
          rejected, and the issue status remains unchanged. Seed values: repository
          `acme-docs`, issue `Improve onboarding`, labels `bug` and `documentation`,
          milestone `Q3 launch`.'
- id: REQ-6
  name: Change Review and Merge Control
  type: FOLDER
  dependencies:
  - REQ-3-3
  - REQ-4-3
  description: A pull request (PR) is a persistent proposal to “merge code changes
    from the compare branch into the base branch”; it is not a branch, commit, or
    issue. The Pull requests page lists the current repository's PR number, title,
    author, source/target branches, and status; “New pull request” first opens the
    comparison page, where the user selects base (the target branch that receives
    the changes) and compare (the source branch that provides the changes) and inspects
    the diff. On the PR detail page, Conversation displays the title, description,
    ordinary comments, activities, and review summary; Commits displays commits on
    the compare branch relative to base; Files changed displays per-file, per-line
    differences; Checks displays check status for the PR's current compare commit.
    A PR's persisted status may only be Draft, Open, Closed, or Merged — normal creation
    produces Open, draft creation produces Draft, and the author or Maintain/Admin
    may mark a Draft as Ready for review to transition it to Open; the author or Maintain/Admin
    may transition an unmerged Open or Draft PR to Closed and may transition Closed
    back to Open; Merged is terminal and cannot be closed or reopened. Write, Maintain,
    and Admin may add inline comments and submit reviews, the author or Maintain/Admin
    may request reviewers, and only Maintain, Admin, or organization Owner may merge.
    Each PR stores a repository-scoped number, source/target branches, creation-time
    and current compare commits, creation-time base commit, title, description, author,
    status, and activity records. When the compare branch receives a new commit, the
    system updates the current compare commit, marks all existing review decisions
    as stale while preserving them in the timeline, recalculates merge eligibility,
    and retains inline comments at their original commit and line position marked
    Outdated. Failure does not change branches or PR state. The following REQ-6 interaction
    contracts use English accessible names and apply to direct navigation as well
    as navigation from a repository. Each named action, field, and navigation link
    is unique on its active page unless explicitly repeated per changed line or reviewer.
    PR titles are headings whose accessible name is exactly the persisted title; list
    titles are links with that same exact name. Conversation, Commits, Files changed,
    and Checks are navigation links, even when visually styled as tabs. The current
    PR status is visible text. Signed-in scenarios begin with the unique Sign in link
    on the home page, labeled Username or email and Password fields, a Sign in button,
    and the account username visible after authentication; each role account has a
    username, verified email, and password. Visitor scenarios use public repositories
    and require no session. Seed records identify the corresponding pages, not to
    private implementation interfaces; role accounts, branches, PRs, and mutable state must
    be provisioned and restored independently for each scenario, including repeated
    and parallel runs. Existing titles, usernames, paths, and branch names described
    below are supplied as seed values and must be displayed verbatim; generated
    PR titles and comments may carry a unique suffix.
  children:
  - id: REQ-6-1
    name: Protect Branches with Review and Status-Check Requirements
    type: ATOMIC
    dependencies:
    - REQ-4-3-1
    - REQ-1-1-2
    description: |-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. A “branch protection rule” is a persistent merge restriction bound to one exact branch name, displayed in the frontend under Settings → Branches, with the backend storing the branch name and rule toggles. This product supports only two independently selectable requirements: “at least 1 valid Approve from someone other than the PR author” and “required check `test` is success”. For a given reviewer on the same current compare commit, only the reviewer's latest decision among Comment, Approve, and Request changes counts. The PR author cannot satisfy the approval requirement; any valid Request changes blocks merging; when the compare branch gains a new commit, all decisions become stale and a new review is required. “Checks” is the results area on the PR detail page attached to the current compare commit; the `test` status of pending, success, or failure, together with the setter and time, must be stored, and only a repository Admin may update that status from this area. The system blocks direct writes to a protected branch and applies the rule during subsequent PR merging. The repository provides a Settings link followed by a Branches link. The rule form opens from the Add branch protection rule button and contains a field labeled Branch name pattern (an exact branch name, with no wildcard semantics), checkboxes named Require 1 approval and Require status check test, and a Create button; an existing rule uses Save changes. After saving and reloading, the branch name is visible verbatim with the summaries 1 approval and Require status check test. For a non-Admin, Add branch protection rule is absent, even if Settings or Branches remain accessible; rejecting a save alone is insufficient. On the PR detail page, the Checks area is available on arrival, displays test: pending initially, and offers the Admin a combobox named test status with a clickable option named success and a Save button. Saving displays test: success and identifies the setter and time, and reloading preserves the result for that compare commit. Seed data comprises a repository Admin and a readable non-Admin account, a dedicated repository and exact branch name with no existing rule before creation, and a separate Open PR targeting protected main with its current test check initially pending.

      Screenshot reference:
      ![image](reference/github-branch-protection.png)
    scenarios:
    - name: 'REQ-6-1: Protect Branches with Review and Status-Check Requirements -
        Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is pull requests `Improve onboarding` and
          `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`. A repository Admin is signed in and has opened “Settings”
          → “Branches”; the repository contains a `main` branch and an Open PR targeting
          `main`. Seed values: pull requests `Improve onboarding` and `Fix search`,
          branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - keyword: WHEN
        content: 'The Admin clicks “Add branch protection rule”, enters the exact
          branch name `main`, checks “Require 1 approval” and “Require status check
          test”, and clicks “Create” or “Save changes”; the Admin then updates `test`
          from pending to success in the PR''s “Checks” area. Seed values: pull requests
          `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
          reviewer `bob-reviewer`, check `test`.'
      - keyword: THEN
        content: 'The settings page displays exactly one rule for `main` with both
          requirements; the PR detail page persistently displays `test: success`,
          the setter, and time. A PR without 1 valid non-author approval, with any
          valid Request changes, or with `test` not equal to success is subsequently
          shown as unmergeable, and the protected branch cannot be directly updated
          to bypass the rule. Seed values: pull requests `Improve onboarding` and
          `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
      - keyword: THEN
        content: 'After refreshing the settings page, the rule still exists; a non-Admin
          either does not see a savable rule-editing entry or has the request rejected
          with the rule unchanged. Seed values: pull requests `Improve onboarding`
          and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
    - name: 'REQ-6-1: Protect Branches with Review and Status-Check Requirements -
        Scenario 2'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is pull requests `Improve onboarding` and
          `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`. A signed-in user without repository-administration permission
          opens the branch-protection settings page. Seed values: pull requests `Improve
          onboarding` and `Fix search`, branches `main` and `feature-search`, reviewer
          `bob-reviewer`, check `test`.'
      - keyword: WHEN
        content: 'The user attempts to create or modify a branch protection rule.
          Seed values: pull requests `Improve onboarding` and `Fix search`, branches
          `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - keyword: THEN
        content: 'Branch-protection controls are unavailable to the non-administrator
          or the operation is rejected, and no protection rule is saved. Seed values:
          pull requests `Improve onboarding` and `Fix search`, branches `main` and
          `feature-search`, reviewer `bob-reviewer`, check `test`.'
    - name: 'REQ-6-1: Protect Branches with Review and Status-Check Requirements -
        Scenario 3'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is pull requests `Improve onboarding` and
          `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`. A repository Admin opens the detail page of an Open PR targeting
          protected `main`; the Checks area shows `test` as pending for the PR''s
          current compare commit. Seed values: pull requests `Improve onboarding`
          and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
      - keyword: WHEN
        content: 'The Admin updates `test` to success in the Checks area and saves.
          Seed values: pull requests `Improve onboarding` and `Fix search`, branches
          `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - keyword: THEN
        content: 'The Checks area displays success, the setter, and the update time;
          after refreshing the PR detail page, that status still corresponds to the
          same compare commit. If the compare branch gains a new commit, the new compare
          commit starts with pending, and success from the old commit cannot be used
          for merging. Seed values: pull requests `Improve onboarding` and `Fix search`,
          branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
  - id: REQ-6-2
    name: Pull Request Discovery and Creation
    type: FOLDER
    dependencies:
    - REQ-4-3
    description: Supports listing and filtering pull requests in the current repository,
      selecting source/target branches to view comparison results, and creating a
      normal or draft pull request from a valid comparison. Read may only view; Write,
      Maintain, and Admin may create PRs. Comparison results are temporary read-only
      context on the creation page; after successful creation, the system persists
      the source/target branches, current compare commit, creation-time base commit,
      title, description, author, and status, then opens the new pull-request detail
      page. Creation must be rejected without leaving a partial record when source
      and target are the same, there are no comparable commits, the same repository
      already has a Draft or Open PR with the same source/target pair, or the user
      lacks creation permission. This feature builds on the persisted objects, opened
      pages, or authenticated-session context provided by REQ-4-3 (Branch Management);
      it must reuse that context and keep pages and data consistent after the context
      changes.
    children:
    - id: REQ-6-2-1
      name: List and Filter Repository Pull Requests
      type: ATOMIC
      dependencies:
      - REQ-3-3
      description: |-
        The Pull requests list page only reads PR records from the current repository; each row displays the number, title, author, status, source branch, and target branch. Any user with repository-view permission may filter by Draft/Open/Closed/Merged status, author, or review status; filtering only affects the current list display and does not modify PRs, branches, or reviews. The public list is directly accessible to a visitor and has an Open link for the status filter; selecting it displays the seeded Open PR as a link whose exact accessible name is its title. Opening that link displays the same title as a heading. After reloading the filtered list, that Open PR remains visible; leaving the page and reopening the list, then selecting Open again, shows the same PR. Seed data includes this public list and a stable, uniquely titled Open PR as well as the Closed PR and author used in the filtering scenario. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes.

        Screenshot reference:
        ![image](reference/github-pull-requests-list.png)
      scenarios:
      - name: 'REQ-6-2-1: List and Filter Repository Pull Requests - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. The user has opened the “Pull requests” page of an accessible
            repository; the list contains one Open PR created by `alice` and one Closed
            PR created by `alice`. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: WHEN
          content: 'The user selects “Open” and filters the author to `alice`. Seed
            values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'The list displays only the Open PR and shows its number, title,
            source/target branches, author, and status; clicking the title opens that
            PR''s detail page. Seed values: pull requests `Improve onboarding` and
            `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: THEN
          content: 'After switching to “Closed”, the Open PR is not displayed; filtering
            does not change the status or review data of any PR. Seed values: pull
            requests `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
      - name: 'REQ-6-2-1: List and Filter Repository Pull Requests - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. The visitor starts at the application home page in a fresh
            unauthenticated browser session. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the list and filter repository pull requests
            workflow. Seed values: pull requests `Improve onboarding` and `Fix search`,
            branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the list and
            filter repository pull requests workflow. Seed values: pull requests `Improve
            onboarding` and `Fix search`, branches `main` and `feature-search`, reviewer
            `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: pull requests `Improve onboarding` and `Fix search`,
            branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - name: 'REQ-6-2-1: List and Filter Repository Pull Requests - Scenario 3'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. The visitor starts at the application home page in a fresh
            unauthenticated browser session. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the list and filter repository pull requests
            workflow. Seed values: pull requests `Improve onboarding` and `Fix search`,
            branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the list and
            filter repository pull requests workflow. Seed values: pull requests `Improve
            onboarding` and `Fix search`, branches `main` and `feature-search`, reviewer
            `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: pull requests `Improve onboarding` and `Fix search`,
            branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
    - id: REQ-6-2-2
      name: Compare Branches Before Opening a Pull Request
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: |-
        The PR comparison page is a read-only page shown before creation: base is the target branch that receives the merge result, and compare is the source branch that provides the changes to merge. A user with Write, Maintain, Admin, or organization Owner status clicks “New pull request” on the “Pull requests” page and selects the two branches; the system calculates comparable commits, changed files, and a diff summary based on the commits they currently point to. If the branches are the same or there is no difference, the creation entry is disabled; comparison does not save a PR, commit, or branch change. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. Only signed-in users with Write, Maintain, Admin, or organization Owner status may compare branches on the repository pull-request page; Read and Triage may view existing PRs but cannot enter the creation-comparison flow. The system validates the role and rejects unauthorized requests. New pull request is a link. The comparison page has native select controls with combobox roles named base and compare; each option's visible label is its exact branch name. Compare changes is a button. For a valid selection it displays the known changed file path verbatim, a Commit summary with the comparable commit count, and an enabled Create pull request button. Selecting the same branch in both fields immediately displays No changes and disables the creation button, without requiring Compare changes to be clicked first. Clicking Compare changes retains that result. Seed data supplies a contributor with Write permission, a public repository PR-list page entry, a base branch, a distinct compare branch ahead by at least one commit, and a known changed file. Separate valid comparison page entrys open the same usable creation flow with the branches already selected; these pairs have no existing Open or Draft PR at the start of each creation scenario.

        The seeded changed-file path for comparison is `src/search.ts`.

        Screenshot reference:
        ![image](reference/github-compare-branches.png)
      scenarios:
      - name: 'REQ-6-2-2: Compare Branches Before Opening a Pull Request - Scenario
          1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. A signed-in user with Write, Maintain, Admin, or organization
            Owner status opens the “Pull requests” page; `feature-search` is one commit
            ahead of `main` and modifies one file. Seed values: pull requests `Improve
            onboarding` and `Fix search`, branches `main` and `feature-search`, reviewer
            `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The user clicks “New pull request”, selects `main` as base and
            `feature-search` as compare, and clicks “Compare changes”. Seed values:
            pull requests `Improve onboarding` and `Fix search`, branches `main` and
            `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'The comparison page displays both branch names, at least one comparable
            commit, changed files, and a diff summary, and provides an enabled “Create
            pull request” entry. Seed values: pull requests `Improve onboarding` and
            `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: THEN
          content: 'After changing compare to `main`, the page explains that the branches
            are the same or have no differences and disables the creation entry; this
            read-only comparison does not create a PR or modify branches. Seed values:
            pull requests `Improve onboarding` and `Fix search`, branches `main` and
            `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - name: 'REQ-6-2-2: Compare Branches Before Opening a Pull Request - Scenario
          2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. A collaborator opens the comparison view on a page where
            base and compare branches can be selected. Seed values: pull requests
            `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The collaborator selects the same branch for both base and compare
            and clicks Compare changes. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: THEN
          content: 'The system explains that the two branches are the same or have
            no differences and keeps the pull-request creation entry disabled. Seed
            values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
    - id: REQ-6-2-3
      name: Create a Pull Request from Comparison Results
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: The valid comparison page is directly accessible to the signed-in
        contributor. Its Create pull request button opens a form with a field labeled
        Title, an optional Description field, and a single Create pull request submit
        button; the comparison-page action is no longer a competing active button.
        Successful submission shows the entered title as the exact PR heading and
        visible Open status, and the title survives reload. A title containing only
        spaces is rejected with Title is required and creates no PR. A user with Write,
        Maintain, or Admin clicks “Create pull request” on a valid comparison-results
        page, enters a title containing 1–256 non-empty characters after trimming
        leading and trailing whitespace and an optional description of at most 65536
        characters, confirms distinct base/compare branches with differences, and
        clicks “Create pull request”. The system atomically creates an Open PR, stores
        a unique repository-scoped number, source/target branches, current compare
        commit, current base commit, title, description, author, creation time, and
        activity record, and redirects to the detail page; if there is no difference,
        the branches are the same, a Draft or Open PR with the same source/target
        pair already exists, the title is empty or overlong, the user lacks permission,
        or submission fails, no record is created. This feature builds on the persisted
        objects, opened pages, or authenticated-session context provided by REQ-6-2-2
        (Compare Branches Before Opening a Pull Request); it must reuse that context
        and keep pages and data consistent after the context changes.
      scenarios:
      - name: 'REQ-6-2-3: Create a Pull Request from Comparison Results - Scenario
          1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. A signed-in collaborator is on a valid comparison-results
            page for `main` and `feature-search`; the page displays at least one changed
            file, and no open PR currently exists for that comparison. Seed values:
            pull requests `Improve onboarding` and `Fix search`, branches `main` and
            `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The user clicks “Create pull request”, enters a title 1 to 256
            characters long and an optional description, confirms base as `main` and
            compare as `feature-search`, and submits. Seed values: pull requests `Improve
            onboarding` and `Fix search`, branches `main` and `feature-search`, reviewer
            `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'The system redirects to the new PR detail page, which displays
            a unique repository-scoped number, Open status, source/target branches,
            title, description, and the current user as author. Seed values: pull
            requests `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'After refreshing the detail page and PR list, the PR still exists;
            if the title is blank or overlong, the branches are the same, there is
            no difference, the user lacks creation permission, or persistence fails,
            no partial record is created. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
      - name: 'REQ-6-2-3: Create a Pull Request from Comparison Results - Scenario
          2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. The visitor starts at the application home page in a fresh
            unauthenticated browser session. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the create a pull request from comparison
            results workflow. Seed values: pull requests `Improve onboarding` and
            `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the create
            a pull request from comparison results workflow. Seed values: pull requests
            `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: pull requests `Improve onboarding` and `Fix search`,
            branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
    - id: REQ-6-2-4
      name: Create a Draft Pull Request
      type: ATOMIC
      dependencies:
      - REQ-6-2-2
      description: A visible draft comparison entry offers a Create draft
        pull request button, which opens the form containing Title and optional Description
        fields and one Create draft pull request submit button. Successful creation
        visibly shows Draft and a present but disabled Merge pull request button.
        A dedicated ready-for-review seed PR is separate from draft creation, belongs
        to the supplied author, initially has no submitted reviews, and displays its
        title, source branch, and target branch verbatim. Its Ready for review button
        changes the same PR to Open; if confirmation is used, it is a single Confirm
        button. Afterward the Draft status marker disappears, the title and branches
        are unchanged, and a Ready for review activity appears; Open persists on reload.
        A user with Write, Maintain, or Admin completes a valid base/compare branch
        selection, clicks “Create draft pull request”, enters a valid title and optional
        description, and confirms creation. The system creates a PR in Draft state
        using the same persisted fields as a normal PR and displays a “Draft” marker;
        a draft cannot submit reviews or be merged. Only the author, Maintain, Admin,
        or organization Owner may click “Ready for review” on a Draft detail page
        to convert it to Open and record an activity; this transition does not change
        branches, commits, title, or number. This feature builds on the persisted
        objects, opened pages, or authenticated-session context provided by REQ-6-2-2
        (Compare Branches Before Opening a Pull Request); it must reuse that context
        and keep pages and data consistent after the context changes.
      scenarios:
      - name: 'REQ-6-2-4: Create a Draft Pull Request - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. A signed-in collaborator is on a valid comparison page for
            two distinct branches with differences and has permission to create a
            PR. Seed values: pull requests `Improve onboarding` and `Fix search`,
            branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The user clicks “Create draft pull request”, enters a valid title
            and optional description, and confirms creation. Seed values: pull requests
            `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'The system creates a detail page displaying the “Draft” marker
            and source/target branches, and the PR list also shows draft status; the
            “Merge pull request” entry cannot be executed. Seed values: pull requests
            `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'After refresh, the draft status and content remain; if there is
            no valid difference or creation fails, no draft record is created. Seed
            values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - name: 'REQ-6-2-4: Create a Draft Pull Request - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
