    - id: REQ-6-3-2
      name: Inspect Changed Files and Aggregate Diff
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      description: Files changed is the read-only diff view on a PR detail page computed
        from the current base and compare commits. From a visible public pull request entry,
        a visitor activates the Files changed link and sees the known changed file
        path verbatim and visible aggregate text such as 3 additions, 1 deletions.
        This public PR seed contains the same known changed-file path `src/search.ts`
        supplied for branch comparison, with one added file and one modified file; it requires
        no sign-in. Each diff block displays the file path and added/deleted lines;
        aggregate statistics show the current PR's number of changed files and line
        counts in the format “<addition count> additions, <deletion count> deletions”.
        Users with repository-view permission may expand files or navigate to lines,
        but this operation does not modify files, commits, branches, comments, or
        review status. This feature builds on the persisted objects, opened pages,
        or authenticated-session context provided by REQ-6-3-1 (View Pull Request
        Overview and Commits); it must reuse that context and keep pages and data
        consistent after the context changes.
      scenarios:
      - name: 'REQ-6-3-2: Inspect Changed Files and Aggregate Diff - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. The user has opened an accessible PR detail page whose comparison
            contains one added file and one modified file. Seed values: pull requests
            `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The user clicks “Files changed”, selects the modified file, and
            expands its diff block. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: THEN
          content: 'The page displays the PR''s changed file paths, added/deleted
            lines for each file, and aggregate statistics; unchanged files are not
            displayed, and the diff corresponds to the current source/base commits.
            Seed values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'After refreshing or switching back to Conversation, the files,
            PR status, and review status remain unchanged; users without permission
            to view a private PR cannot obtain its diff content. Seed values: pull
            requests `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
    - id: REQ-6-3-3
      name: Add Review Comments to Changed Code Lines
      type: ATOMIC
      dependencies:
      - REQ-6-3-2
      - REQ-1-1-2
      description: An inline review comment is a comment record anchored to a file
        path, the current compare commit, and a specific added/deleted line in Files
        changed; it differs from an ordinary comment in Conversation that has no code
        location. A user with Write, Maintain, or Admin who is not the PR author can
        hover over a changed line, click the button visually shown as “+” and accessibly
        named Add comment, and choose “Add single comment” to publish immediately
        or “Start a review” to keep it as a pending review draft. The changed-line
        Add comment buttons are available for direct activation without a prerequisite
        hover; the first such button in document order targets the first commentable
        changed line. Activating one opens a single editor labeled Comment with Add
        single comment and Start a review buttons. Add single comment immediately
        displays the exact entered body in that diff view and retains it after reload.
        Start a review displays the body and Pending review to its author immediately,
        retains the pending draft after reload, and does not make it public before
        review submission. Seed data supplies a non-author Write reviewer, an Open
        reviewable PR with at least one changed line, and a separate Open PR for the
        pending-comment scenario. The system stores the PR, file path, compare commit,
        line position, author, body, and publication state; when the compare commit
        changes, published comments are retained but marked Outdated, while drafts
        are not published automatically. This feature builds on the persisted objects,
        opened pages, or authenticated-session context provided by REQ-6-3-2 (Inspect
        Changed Files and Aggregate Diff) and REQ-1-1-2 (Sign In with an Existing
        Account); it must reuse that context and keep pages and data consistent after
        the context changes.
      scenarios:
      - name: 'REQ-6-3-3: Add Review Comments to Changed Code Lines - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. A signed-in reviewer opens the “Files changed” page of a
            PR they are allowed to comment on and locates an added code line and its
            file path. Seed values: pull requests `Improve onboarding` and `Fix search`,
            branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The reviewer hovers over the added line and clicks “+”, enters
            a non-empty inline comment, and selects “Add single comment”. Seed values:
            pull requests `Improve onboarding` and `Fix search`, branches `main` and
            `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'Conversation and the diff page immediately display the comment;
            the comment record is associated with the current PR, file path, diff
            commit, and target line position and displays the reviewer and body. Seed
            values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'After refresh, the comment remains anchored to that file and line;
            when “Start a review” is selected, the comment remains pending and is
            not public until the review is submitted, while an empty comment or failed
            submission does not display a partial comment. Seed values: pull requests
            `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
      - name: 'REQ-6-3-3: Add Review Comments to Changed Code Lines - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. The reviewer locates a changed line in the pull request''s
            Files changed view. Seed values: pull requests `Improve onboarding` and
            `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: WHEN
          content: 'The reviewer enters an inline comment and selects Start a review
