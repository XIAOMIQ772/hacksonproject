    - id: REQ-6-3-4
      name: Submit a Pull Request Review
      type: ATOMIC
      dependencies:
      - REQ-6-3-1
      - REQ-1-1-2
      description: From the Files changed link, the reviewer activates the Review
        changes button to open one review form with an optional Summary field, radio
        controls named Comment, Approve, and Request changes, and a Submit review
        button. Selecting Approve and submitting without a summary is valid and displays
        Approved. Selecting Request changes with a summary displays Changes requested
        and that exact summary; the decision remains visible after reload. Seed data
        supplies a non-author Write reviewer and separate Open PRs for approval and
        request-changes submission, with no initial effective decision by that reviewer.
        A user who is not the PR author and has Write, Maintain, or Admin may submit
        Comment, Approve, or Request changes on an Open PR; the author and Draft PRs
        cannot submit reviews. The system stores the review decision, reviewer, current
        compare commit, optional explanation, and time; a new decision by the same
        reviewer replaces that reviewer's effective decision for the current commit
        while preserving the old record. Approve is valid only when the reviewer is
        not the author and the compare commit is still the same; Request changes blocks
        merging until that reviewer submits a new Comment or Approve for the current
        compare commit, or the compare branch receives a new commit that makes the
        old decision stale. This feature builds on the persisted objects, opened pages,
        or authenticated-session context provided by REQ-6-3-1 (View Pull Request
        Overview and Commits) and REQ-1-1-2 (Sign In with an Existing Account); it
        must reuse that context and keep pages and data consistent after the context
        changes.
      scenarios:
