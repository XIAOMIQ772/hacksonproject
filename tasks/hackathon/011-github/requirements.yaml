- id: REQ-4
  name: Code and Version Control
  type: FOLDER
  dependencies:
  - REQ-3-3
  description: The Code page is the main page for browsing code in a repository —
    the top of the page displays the current branch selector, the main area displays
    files and directories at the current path on the current branch, clicking a file
    opens a read-only file page, and clicking Commits opens commit history. A file
    is content at a path on a branch; a directory is only a path hierarchy used for
    organization and is not an independent collaboration object. A branch is a named
    reference pointing to a commit, and switching branches only changes the file snapshot
    read by the current page. A commit is an immutable change record that stores the
    parent commit, author, message, time, and changed files; users with Write, Maintain,
    Admin, or organization Owner permission can create new commits from a file page
    through Edit or Add file. Every file, commit, comparison, and branch page displays
    the repository and current branch or revision. Editing a file must create a new
    commit and must not rewrite historical content. Seed data for read-only scenarios
    consists of public repositories and directly openable repository, file, and commit
    pages; visitors need not sign in to browse files, history, diffs, code search,
    or existing branches. Write scenarios provide separate existing contributor accounts
    with Write or higher permission on their target repositories and an unprotected
    writable branch; default-branch scenarios provide an Admin and a separate readable
    non-Admin account. These accounts sign in through the home-page “Sign in” link,
    the “Username or email” and “Password” fields, and the “Sign in” button; the signed-in
    username is visible before opening the target repository entry. Unless a narrower scope is
    explicitly given below, each named control is unique on the active page, and field
    and option names refer to accessible names.
  children:
  - id: REQ-4-1
    name: Browse Repository Files and Directories
    type: ATOMIC
    dependencies:
    - REQ-3-3
    description: |-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-3-3 (View a Public Repository Overview); it must reuse that context and keep pages and data consistent after the context changes. Any user with repository-view permission can browse directories and files on the selected branch from the Code page; a directory page displays the current path, while a file page reads the stored content, most recent commit, and file name for that branch and path without creating file changes. Seed data includes a known directory on the default branch, a known text file immediately inside it, and its expected content. The directory and file entries are links whose exact accessible names are their respective directory and file names. Clicking them in order opens the saved text, with the expected content visible as a complete text value; reloading that file page retains the same branch, path, and content.

      Screenshot reference:
      ![image](reference/github-code-file-browser.png)
    scenarios:
    - name: 'REQ-4-1: Browse Repository Files and Directories - Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is repository `acme-docs`, branches `main`
          and `feature-search`, file `README.md`, commit `Document search flow`. The
          user has opened the “Code” page of an accessible repository; the current
          branch contains files in the root directory, a nested directory, and a text
          file inside that directory. Seed values: repository `acme-docs`, branches
          `main` and `feature-search`, file `README.md`, commit `Document search flow`.'
      - keyword: WHEN
        content: 'The user clicks the nested-directory name and then clicks the text-file
          name inside it. Seed values: repository `acme-docs`, branches `main` and
          `feature-search`, file `README.md`, commit `Document search flow`.'
      - keyword: THEN
        content: 'The directory page displays the current branch, path breadcrumbs,
          and the file list for that directory; the file page displays the full path,
          current branch, and readable file content, and the breadcrumbs can return
          to the parent directory. Seed values: repository `acme-docs`, branches `main`
          and `feature-search`, file `README.md`, commit `Document search flow`.'
      - keyword: THEN
        content: 'After switching to another branch that does not contain the file,
          the file is not displayed; refreshing the current file page does not modify
          file content or the branch. Seed values: repository `acme-docs`, branches
          `main` and `feature-search`, file `README.md`, commit `Document search flow`.'
  - id: REQ-4-2
    name: Commit History and Code Search
    type: FOLDER
    dependencies:
    - REQ-4-1
    description: The “commit history” page displays commit records for a branch or
      file path in reverse chronological order; the “diff” page compares the file
      contents of two commits or revisions line by line, where base is the earlier
      or target revision and compare is the newer or to-be-compared revision; the
      “code search” page searches for keywords only within readable file content in
      the current repository. All three are read-only views that do not create commits
      or modify files or branches and follow repository visibility and access permissions.
      This feature builds on the persisted objects, opened pages, or authenticated-session
      context provided by REQ-4-1 (Browse Repository Files and Directories); it must
      reuse that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-4-2-1
      name: View Repository Commit History
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: |-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes. Any user with repository-view permission can read branch history on the Commits page, or from a file page read only the history that modified that file; each record references the stored commit identifier, author, time, message, parent commit, and changed files. The repository and file pages each expose one history link named “Commits” (a commit count may accompany the visible label without introducing another matching link). Seed history includes a known commit message and author, displayed in full as distinct readable text values, and a relative timestamp containing “ago”. Opening the branch history directly from the repository must show these values without first selecting a file-specific scope.

        Screenshot reference:
        ![image](reference/github-commit-history.png)
      scenarios:
      - name: 'REQ-4-2-1: View Repository Commit History - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            The user has opened the default branch of an accessible repository; the
            branch contains at least two commits, and the later commit modified a
            known file. Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
        - keyword: WHEN
          content: 'The user clicks the commit-count link above the file list or “Commits”,
            then selects the history scope for the known file. Seed values: repository
            `acme-docs`, branches `main` and `feature-search`, file `README.md`, commit
            `Document search flow`.'
        - keyword: THEN
          content: 'The history page displays commits within that scope with the newest
            first; each item shows the short hash, commit message, author, and time,
            and the file-scoped history does not display commits that did not modify
            that file. Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'After clicking any commit to enter its detail page, the corresponding
            parent revision and changed files remain visible; refreshing the history
            page does not change commit order or content. Seed values: repository
            `acme-docs`, branches `main` and `feature-search`, file `README.md`, commit
            `Document search flow`.'
    - id: REQ-4-2-2
      name: Inspect Commit and Revision Differences
      type: ATOMIC
      dependencies:
      - REQ-4-2-1
      description: |-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-2-1 (View Repository Commit History); it must reuse that context and keep pages and data consistent after the context changes. Any user with repository-view permission can compare two readable commits or revisions on the diff page; the page reads and displays the changed files and line-by-line additions and deletions between them without creating a review, comment, or commit. A seeded commit has an accessible commit entry, a known changed-file path `src/search.ts`, and a readable parent revision. Opening that commit entry as a visitor displays the changed-file path as an exact text value, the “Changed files” summary, and the numeric additions/deletions summary described below, without requiring previous navigation through history.

        Screenshot reference:
        ![image](reference/github-commit-diff.png)
      scenarios:
      - name: 'REQ-4-2-2: Inspect Commit and Revision Differences - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            The user has opened commit history for an accessible repository; there
            is a commit containing added and modified files, and its parent commit
            is accessible. Seed values: repository `acme-docs`, branches `main` and
            `feature-search`, file `README.md`, commit `Document search flow`.'
        - keyword: WHEN
          content: 'The user clicks the short hash of that commit, or selects its
            parent commit as base and that commit as compare on the comparison page
            and clicks “Compare”. Seed values: repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'The diff page displays the base and compare identifiers, the list
            of changed files, and added/deleted lines for each file; clicking a changed
            file navigates to that file''s diff, and unchanged files do not appear
            in the list. Seed values: repository `acme-docs`, branches `main` and
            `feature-search`, file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'Refreshing or returning to commit history does not cause the read-only
            comparison to modify repository branches, commits, or files; if the user
            lacks permission to view either revision, its diff content is not displayed.
            Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
    - id: REQ-4-2-3
      name: Search Code Within a Repository
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: |-
        The user enters a code keyword in the search box at the top of the repository page and presses Enter, selects the “Code” results page, can further filter by path or language, and clicks a matching file. The system displays matching snippets, file paths, and branch/revision context within the visible code scope of the current repository; clicking a result opens the corresponding file location. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes. Visitors can search from the Code page of a public repository, while signed-in accounts can search any repository they are authorized to view; the results page only reads file content, matching snippets, and paths from currently visible branches of the current repository and cannot leak results across repositories or write code. The repository page and search results expose one searchbox named “Search”; after Enter, a unique link named “Code” selects code results. This results-type link must remain distinguishable from repository navigation so the active search page has only one Code link. Path and language filters are optional, and an unfiltered search can immediately open a result link whose exact accessible name is the matching file name. Seed data provides the known query `search flow`, a matching file `README.md` with that query visible as a complete text value, and the absent query `no-such-token`, which does not occur in searchable code. Opening the matching file shows that text; refreshing preserves the file context, text, and a link named exactly after the file. For the absent query, show “No code results” and retain the exact query in Search. Returning to the repository and repeating the same search produces the same empty state without stale matches.

        Screenshot reference:
