  - id: REQ-4-3
    name: Branch Management
    type: FOLDER
    dependencies:
    - REQ-4-1
    description: The branch selector is the control at the top of the Code page that
      lists and switches branches; the system stores a unique name and current pointed-to
      commit for each branch. Creating a branch creates a new named reference at a
      specified base commit; it does not copy files or rewrite base history. The default
      branch is the branch read by default when opening the repository overview or
      a repository entry without a specified branch; it is not the only existing or writable branch.
      A branch name is 1–255 characters and may contain only ASCII letters, digits,
      `-`, `_`, `.`, and `/`; it must not end with `/` or `.`, and must not contain
      consecutive `..` or `//`; duplicate names, invalid names, or lack of permission
      must prevent branch creation. Changing the default branch must not alter existing
      branches, commits, or source/target references of already-open PRs. This feature
      builds on the persisted objects, opened pages, or authenticated-session context
      provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse
      that context and keep pages and data consistent after the context changes.
    children:
    - id: REQ-4-3-1
      name: List and Switch Repository Branches
      type: ATOMIC
      dependencies:
      - REQ-4-1
      description: |-
        This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories); it must reuse that context and keep pages and data consistent after the context changes. Any user with repository-view permission can use the branch selector at the top of the Code page to list and switch branches; the “current branch” is the branch jointly referenced by the selector, page entry, and file list, not an additionally persisted user setting. Matching branch options or the “No matching branch” state update as the user types in the branch textbox; pressing Enter or activating a separate search button is not required. The selector is a unique button named “Branch <current branch name>”; it opens a textbox named “Find branch” and selectable items with role option whose exact accessible names are the branch names. Seed data includes active branch `main`, target branch `feature-search` containing the file `main-only.md` absent from `main`, and an unknown search term matching no branch. Selecting the target immediately updates the button's branch name and shows a link with the exact target-only file name. Escape closes the selector; for an unmatched search it preserves the original active branch before and after reload.

        Screenshot reference:
        ![image](reference/github-branch-selector.png)
      scenarios:
      - name: 'REQ-4-3-1: List and Switch Repository Branches - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            The user has opened the `main` branch of an accessible repository; the
            repository also contains a `feature-search` branch, and the two branches
            differ in the content of a known file. Seed values: repository `acme-docs`,
            branches `main` and `feature-search`, file `README.md`, commit `Document
            search flow`.'
        - keyword: WHEN
          content: 'The user opens the branch selector currently showing `main`, enters
            `feature-search`, and clicks that branch name. Seed values: repository
            `acme-docs`, branches `main` and `feature-search`, file `README.md`, commit
            `Document search flow`.'
        - keyword: THEN
          content: 'The page, branch selector, and file list all switch to `feature-search`,
            and the known file displays the content from that branch; the selector
            can list both `main` and the target branch and marks the current branch.
            Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'Selecting `main` again restores its file content; switching branches
            does not create a commit or change either branch head. Seed values: repository
            `acme-docs`, branches `main` and `feature-search`, file `README.md`, commit
            `Document search flow`.'
      - name: 'REQ-4-3-1: List and Switch Repository Branches - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            A user with repository-view permission has opened the branch selector
            on the Code page, and the selector currently displays an existing branch.
            Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
        - keyword: WHEN
          content: 'The participant enters a branch query with no matching result.
            Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'The system displays an empty branch-search state and retains the
            current active branch after the selector is closed or the page is reloaded.
            Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
    - id: REQ-4-3-2
      name: Create a Branch from an Existing Revision
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: |-
        The user opens the branch selector, enters a new branch name, confirms the displayed base branch or commit, and clicks “Create branch: <name>”. As the user types, a valid unused name displays the “Create branch: <name>” option without requiring Enter or a separate search action, while an invalid name immediately displays “Invalid branch”. The system creates a new branch pointing to that base commit and switches the selector to it; if the name already exists or the user lacks permission, no branch is created. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. Only signed-in users with Write, Maintain, Admin, or organization Owner status may create branches on repository code and version-control pages; Read and Triage may only browse. The system validates the role, stores the new branch name, base commit, creator, and time, and rejects unauthorized requests. The selector and “Find branch” textbox use REQ-4-3-1's roles. For a valid unused name, the creation entry has role option and accessible name “Create branch: <name>”. Its displayed base defaults to the current branch head; selecting this option performs creation and switches branches without a second mandatory confirmation. Reloading the resulting page entry keeps the newly created branch selected. In particular, entering `invalid..branch` immediately shows “Invalid branch” and cannot create a reference; generated valid names such as `pw-branch-<unique suffix>` follow the same rules.

        Screenshot reference:
        ![image](reference/github-create-branch.png)
      scenarios:
      - name: 'REQ-4-3-2: Create a Branch from an Existing Revision - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            A signed-in user with write permission has opened the repository''s `main`
            branch; the current branch-head commit is known, and the target name `feature/api-v2`
            does not exist. Seed values: repository `acme-docs`, branches `main` and
            `feature-search`, file `README.md`, commit `Document search flow`.'
        - keyword: WHEN
          content: 'The user opens the branch selector, enters `feature/api-v2`, confirms
            that the base is the current `main` branch-head commit, and clicks “Create
            branch: feature/api-v2”. Seed values: repository `acme-docs`, branches
            `main` and `feature-search`, file `README.md`, commit `Document search
            flow`.'
        - keyword: THEN
          content: 'The system creates the branch and switches the browsing context
            to it; the initial commit in the branch details matches the original `main`
            branch head, and the original branch history and files are not rewritten.
            Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'After refreshing the branch list, the new branch still exists;
            if the name is empty, contains invalid characters, ends with `/` or `.`,
            contains `..` or `//`, duplicates an existing name, or the user lacks
            write permission, an error is displayed and no branch is created. Seed
            values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
      - name: 'REQ-4-3-2: Create a Branch from an Existing Revision - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            The visitor starts at the application home page in a fresh unauthenticated
            browser session. Seed values: repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.'
        - keyword: WHEN
          content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
            follows the visible controls for the create a branch from an existing
            revision workflow. Seed values: repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'The page displays the required headings, controls, values, and status for the create
            a branch from an existing revision workflow. Seed values: repository `acme-docs`,
            branches `main` and `feature-search`, file `README.md`, commit `Document
            search flow`.'
        - keyword: THEN
          content: 'After refreshing or reopening the visible destination, the successful
            result remains persisted; a rejected action leaves the original state
            unchanged. Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
    - id: REQ-4-3-3
      name: Change the Repository Default Branch
      type: ATOMIC
      dependencies:
      - REQ-4-3-1
      - REQ-1-1-2
      description: |-
        A repository administrator enters “Settings” → “Branches”, selects an existing branch from the “Default branch” dropdown, clicks “Update”, and then confirms the change. The system saves the new default branch and updates the initial branch shown when the repository is newly opened; it does not delete or rewrite the previous default branch. This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-3-1 (List and Switch Repository Branches) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. Only a repository Admin or organization Owner may change the default branch on repository code and version-control pages; other roles may only view. The system validates the role, stores the new default branch together with the operator and time, and rejects unauthorized requests. “Settings” and “Branches” are unique links on their respective pages; “Default branch” is a native HTML select element exposing the combobox role, with options labeled by exact existing branch names; selecting an option must use the native selection behavior. The administrator selects a different seeded branch, activates the “Update” button, and then the “Confirm” button in the confirmation dialog. Opening the repository page entry without a branch then shows “Branch <new default branch name>”; opening that selector still offers an option named exactly after the old default branch. A non-Admin may have Settings or Branches links hidden or may open a read-only settings page, but no “Default branch” combobox or default-branch update button is rendered for that user; a merely disabled editable selector is insufficient.

        Screenshot reference:
        ![image](reference/github-default-branch-settings.png)
      scenarios:
      - name: 'REQ-4-3-3: Change the Repository Default Branch - Scenario 1'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            A repository Admin is signed in; the repository already has `main` and
            `release` branches, the current default branch is `main`, and both branches
            retain their respective commit histories. Seed values: repository `acme-docs`,
            branches `main` and `release`, file `README.md`, commit `Document
            search flow`.'
        - keyword: WHEN
          content: 'The Admin enters “Settings” → “Branches”, selects `release` from
            the “Default branch” dropdown, clicks “Update”, and confirms in the confirmation
            dialog. Seed values: repository `acme-docs`, branches `main` and `release`,
            file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'The system saves `release` as the default branch; newly opening
            the repository overview displays `release` by default, while the `main`
            branch and its commits remain available in the selector. Seed values:
            repository `acme-docs`, branches `main` and `release`, file `README.md`,
            commit `Document search flow`.'
        - keyword: THEN
          content: 'After refreshing the settings page, the default branch is still
            `release`; only existing branches can be selected, and for a non-Admin
            the update entry is unavailable or the request is rejected with the default
            branch unchanged. Seed values: repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.'
      - name: 'REQ-4-3-3: Change the Repository Default Branch - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is repository `acme-docs`, branches `main`
            and `feature-search`, file `README.md`, commit `Document search flow`.
            A signed-in user without repository-administration permission opens the
            Branches page in repository settings. Seed values: repository `acme-docs`,
            branches `main` and `feature-search`, file `README.md`, commit `Document
            search flow`.'
        - keyword: WHEN
          content: 'The user attempts to view or update the default-branch setting.
            Seed values: repository `acme-docs`, branches `main` and `feature-search`,
            file `README.md`, commit `Document search flow`.'
        - keyword: THEN
          content: 'The default-branch update operation is unavailable to the non-administrator
            or is rejected, and the saved default branch remains unchanged. Seed values:
            repository `acme-docs`, branches `main` and `feature-search`, file `README.md`,
            commit `Document search flow`.'
  - id: REQ-4-4
    name: Manage Repository Files Through the Web Interface
    type: ATOMIC
    dependencies:
    - REQ-4-1
    - REQ-1-1-2
    description: |-
      This feature builds on the persisted objects, opened pages, or authenticated-session context provided by REQ-4-1 (Browse Repository Files and Directories) and REQ-1-1-2 (Sign In with an Existing Account); it must reuse that context and keep pages and data consistent after the context changes. The file editor is the form opened from Edit or Add file on the Code page; the user edits file content at a path on the current branch and submits it. Only Write, Maintain, Admin, or organization Owner may submit; Read and Triage may only view. A single submission stores the file-path and content change, commit message, author, parent commit, and target branch as one indivisible record and moves the target branch to point to that new commit. A new or renamed file path must not be empty, must not begin with `/`, must not contain a `..` path segment, and must not conflict with an existing file or directory on the current branch; the commit message must contain 1–72 non-empty characters after trimming leading and trailing whitespace. If the path conflicts, content validation fails, the commit message is noncompliant, the branch is protected, or persistence fails, the page displays the reason and does not change the file, branch head, or commit history. An invalid path displays “Invalid file path”, and an empty commit message displays “Commit message is required”. From the writable Code page, the unique “Add file” button opens the “Create new file” menuitem. The editor has a field labeled “File name”, a textbox named “File contents”, an initially empty field labeled “Commit message”, and a “Commit changes” button. Creating a unique file such as `pw-file-<unique suffix>.md` with nonempty text and a message such as `Add <file name>` immediately opens a view displaying the exact saved content. Its “Commits” link opens history displaying the exact submitted message. Submitting `../invalid.md` with content `must not be saved` and no commit message reports the invalid path and/or required message and changes neither files nor history. The example content is ordinary text, not a forbidden content value by itself; rejection follows from the invalid path or missing message.

      Screenshot reference:
      ![image](reference/github-web-file-editor.png)
    scenarios:
    - name: 'REQ-4-4: Manage Repository Files Through the Web Interface - Scenario
        1'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is repository `acme-docs`, branches `main`
          and `feature-search`, file `README.md`, commit `Document search flow`. A
