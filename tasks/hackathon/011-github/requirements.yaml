        - keyword: THEN
          content: 'The system saves the review comment and changes requested status
            and continues to display the decision after reload. Seed values: pull
            requests `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
  - id: REQ-6-4
    name: Request or Remove Pull Request Reviewers
    type: ATOMIC
    dependencies:
    - REQ-6-2-3
    - REQ-1-1-2
    description: The Reviewers button opens a picker with a textbox named Search.
      Typing an eligible username immediately reveals an option with that exact accessible
      name. Selecting the option saves the request immediately without a separate
      Save action, closes the picker, and displays the username in the reviewer area;
      it remains after reload. Each requested reviewer has a button named Remove followed
      by a space and the username; clicking it immediately removes the request and
      the username from that area, without a confirmation step. The seed PR is Open,
      belongs to the signed-in author, and initially has no request or submitted review
      from the eligible target reviewer; the target is a distinct non-author collaborator
      with Write or higher permission. Removing a request persists across reload.
      A “reviewer request” is a pending-review relationship between a PR and a candidate
      reviewer account, displayed in the Reviewers area on the right side of the PR
      detail page; it is not the same as a submitted review decision. The author of
      an Open or Draft PR, Maintain, Admin, or organization Owner may create or delete
      this relationship. Matching reviewer options update as the user types in the
      search textbox; pressing Enter or activating a separate search button is not
      required before selecting an option. A candidate reviewer must have Write, Maintain,
      or Admin on the repository and must not be the PR author; the system stores
      or deletes the “PR-reviewer request” relationship together with the operator
      and time. Removing a request does not delete reviews, comments, or activity
      records already submitted by that user and does not change the user's effective
      review decision. This feature builds on the persisted objects, opened pages,
      or authenticated-session context provided by REQ-6-2-3 (Create a Pull Request
      from Comparison Results) and REQ-1-1-2 (Sign In with an Existing Account); it
      must reuse that context and keep pages and data consistent after the context
      changes.
    scenarios:
    - name: 'REQ-6-4: Request or Remove Pull Request Reviewers - Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is pull requests `Improve onboarding` and
          `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`. The PR author or a maintainer is signed in and has opened
          an Open PR detail page; the repository contains a collaborator who is eligible
          to be requested as a reviewer. Seed values: pull requests `Improve onboarding`
          and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
      - keyword: WHEN
        content: 'The user searches for and selects the collaborator under “Reviewers”
          on the right, saves, and then clicks the remove button beside that collaborator.
          Seed values: pull requests `Improve onboarding` and `Fix search`, branches
          `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - keyword: THEN
        content: 'After selection, the account is shown on the right as a requested
          reviewer; after removal, the request disappears; this does not automatically
          generate an approval or comment. Seed values: pull requests `Improve onboarding`
          and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
      - keyword: THEN
        content: 'After refreshing the detail page, only the final request set remains;
          a user who is neither the author nor a maintainer cannot modify requests.
          Seed values: pull requests `Improve onboarding` and `Fix search`, branches
          `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
  - id: REQ-6-5
    name: Merge an Eligible Pull Request
    type: ATOMIC
    dependencies:
    - REQ-6-3-4
    - REQ-6-1
    description: 'On an eligible PR, Merge pull request and then Confirm merge are
      buttons; confirming displays Merged, and that state remains after reload. A
      blocked PR keeps a visible disabled Merge pull request button and explains its
      unmet review or protection condition before any click. Seed data supplies a
      Maintain account and separate Open PRs for success and refusal. The eligible
      PR targets protected main, has a current non-author approval and test: success,
      and has no conflicts. The blocked PR targets a protected branch and lacks the
      required valid approval; its disabled button is accompanied by Review required
      by branch protection. Each seed state is restored independently before reuse. “Merge”
      is the only write operation that writes the current compare commit''s changes
      from an Open PR into the base branch; it is not simply marking the PR as complete.
      Only Maintain, Admin, or organization Owner may merge from the PR detail page
      using the sole supported “Create a merge commit” method; the merge confirmation
      area should display satisfied and unsatisfied conditions. Before confirmation,
      the system rereads the target branch head, current compare commit, merge-conflict
      state, and protection rules — there must be no valid Request changes; if the
      target is protected, each enabled rule requirement is enforced independently,
      requiring 1 valid non-author Approve for the current compare commit when Require
      1 approval is enabled and requiring `test` success when Require status check
      test is enabled. An unprotected target has no additional approval-count or check-success
      requirement, but merging still requires no merge conflicts and no valid Request
      changes review. After validation succeeds, the system atomically creates a merge
      commit whose parents are the target-branch head at merge time and the current
      compare commit, updates the target-branch head, sets the PR to Merged, and stores
      the merger, time, and resulting commit identifier. If any condition is unsatisfied
      or persistence fails, the page explains the applicable reason and neither the
      target branch nor PR changes; a missing required approval displays “Review required
      by branch protection”. Merged is terminal. This feature builds on the persisted
      objects, opened pages, or authenticated-session context provided by REQ-6-3-4
      (Submit a Pull Request Review) and REQ-6-1 (Protect Branches with Review and
      Status-Check Requirements); it must reuse that context and keep pages and data
      consistent after the context changes.'
    scenarios:
    - name: 'REQ-6-5: Merge an Eligible Pull Request - Scenario 1'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is pull requests `Improve onboarding` and
          `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`. A signed-in user with Maintain, Admin, or organization Owner
          status opens an Open, non-draft PR; its target `main` branch is protected,
          it has 1 valid non-author Approve for the current compare commit, `test`
          is success in Checks, and the current diff has no merge conflict. Seed values:
          pull requests `Improve onboarding` and `Fix search`, branches `main` and
          `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - keyword: WHEN
        content: 'The maintainer confirms that the only selectable method on the page
          is “Create a merge commit”, clicks “Merge pull request”, and clicks “Confirm
          merge” in the confirmation box. Seed values: pull requests `Improve onboarding`
          and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
      - keyword: THEN
        content: 'The PR displays Merged, the merger, time, and resulting commit identifier;
          the `main` branch head is updated to the merge result, and the PR''s source-
          and target-branch content is integrated according to the selected merge
          method. Seed values: pull requests `Improve onboarding` and `Fix search`,
          branches `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - keyword: THEN
        content: 'After refreshing the PR and `main` branch, the merged status and
          resulting commit remain; if the PR is a draft, lacks approval, has a failed
          check, is unmergeable, or the user lacks permission, the merge entry is
          disabled or rejected and the target branch and PR state remain unchanged.
          Seed values: pull requests `Improve onboarding` and `Fix search`, branches
          `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
    - name: 'REQ-6-5: Merge an Eligible Pull Request - Scenario 2'
      steps:
      - keyword: GIVEN
        content: 'The visitor starts at the application home page in a fresh unauthenticated
          browser session. The seeded data is pull requests `Improve onboarding` and
          `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`. The visitor starts at the application home page in a fresh
          unauthenticated browser session. Seed values: pull requests `Improve onboarding`
          and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
      - keyword: WHEN
        content: 'The user signs in as `alice-dev` with `Valid-password-123!` and
          follows the visible controls for the merge an eligible pull request workflow.
          Seed values: pull requests `Improve onboarding` and `Fix search`, branches
          `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
      - keyword: THEN
        content: 'The page displays the required headings, controls, values, and status for the merge an
          eligible pull request workflow. Seed values: pull requests `Improve onboarding`
          and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
          check `test`.'
      - keyword: THEN
        content: 'After refreshing or reopening the visible destination, the successful
