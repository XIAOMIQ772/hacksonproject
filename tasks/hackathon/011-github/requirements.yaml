            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. A signed-in reviewer opens an Open PR that can be reviewed,
            and the PR currently has no “Approved” decision from that reviewer. Seed
            values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The reviewer clicks “Review changes” under “Files changed”, enters
            an overall comment, selects “Approve”, and clicks “Submit review”. Seed
            values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: THEN
          content: 'Conversation and the review summary on the right display the reviewer,
            Approved status, overall comment, and time; branch-protection merge-eligibility
            checks can read this decision. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`.'
        - keyword: THEN
          content: 'After refresh, the decision still exists; selecting “Request changes”
            displays the corresponding status, while a user without review permission
            or a failed submission does not persist a decision. Seed values: pull
            requests `Improve onboarding` and `Fix search`, branches `main` and `feature-search`,
            reviewer `bob-reviewer`, check `test`.'
      - name: 'REQ-6-3-4: Submit a Pull Request Review - Scenario 2'
        steps:
        - keyword: GIVEN
          content: 'The visitor starts at the application home page in a fresh unauthenticated
            browser session. The seeded data is pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
            check `test`. A reviewer opens a pull request that can be reviewed. Seed
            values: pull requests `Improve onboarding` and `Fix search`, branches
            `main` and `feature-search`, reviewer `bob-reviewer`, check `test`.'
        - keyword: WHEN
          content: 'The reviewer enters review feedback, selects Request changes,
            and submits the review. Seed values: pull requests `Improve onboarding`
            and `Fix search`, branches `main` and `feature-search`, reviewer `bob-reviewer`,
